<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShopBoss</title>
  <!-- Telegram Mini App SDK — MUST be first -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js"></script>
  <style>
    :root {
      --bg:#0f1117; --surface:#181c27; --surface2:#1e2435; --border:#2a3045;
      --gold:#f5c518; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
      --text:#e8eaf0; --muted:#7a8099; --radius:12px; --radius-sm:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;min-height:100vh;overscroll-behavior:none;}
    #root{display:flex;flex-direction:column;min-height:100vh;}
    .app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 16px 10px;position:sticky;top:0;z-index:100;}
    .app-header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;color:var(--gold);}
    .app-header p{font-size:11px;color:var(--muted);margin-top:1px;}
    .tab-bar{display:flex;gap:2px;background:var(--surface);border-bottom:1px solid var(--border);padding:0 8px;overflow-x:auto;scrollbar-width:none;}
    .tab-bar::-webkit-scrollbar{display:none;}
    .tab{padding:10px 14px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:color 0.15s;background:none;border-top:none;border-left:none;border-right:none;}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .page{padding:16px;flex:1;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
    .card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:12px;}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;}
    .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
    .stat-value{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-0.5px;}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
    .up{color:var(--green);} .down{color:var(--red);} .gold{color:var(--gold);} .amber{color:var(--amber);}
    .list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
    .list-item:last-child{border-bottom:none;padding-bottom:0;} .list-item:first-child{padding-top:0;}
    .list-left{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
    .list-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .list-meta{font-size:11px;color:var(--muted);}
    .list-right{text-align:right;flex-shrink:0;margin-left:12px;}
    .list-amount{font-weight:700;font-size:13px;}
    .list-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;display:inline-block;}
    .badge-green{background:rgba(34,197,94,0.15);color:var(--green);}
    .badge-red{background:rgba(239,68,68,0.15);color:var(--red);}
    .badge-amber{background:rgba(245,158,11,0.15);color:var(--amber);}
    .chart-wrap{width:100%;height:160px;margin-top:8px;}
    .alert{display:flex;align-items:flex-start;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;}
    .alert-icon{font-size:18px;line-height:1;flex-shrink:0;}
    .alert-body{flex:1;}
    .alert-title{font-weight:600;font-size:13px;}
    .alert-desc{font-size:11px;color:var(--muted);margin-top:2px;}
    .ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px);}
    .ai-messages{flex:1;overflow-y:auto;padding-bottom:8px;}
    .ai-bubble{margin-bottom:10px;max-width:88%;}
    .ai-bubble.bot{margin-right:auto;} .ai-bubble.user{margin-left:auto;}
    .ai-bubble-inner{padding:10px 13px;border-radius:var(--radius);font-size:13px;line-height:1.5;}
    .ai-bubble.bot .ai-bubble-inner{background:var(--surface2);border:1px solid var(--border);}
    .ai-bubble.user .ai-bubble-inner{background:var(--gold);color:#111;font-weight:500;}
    .ai-name{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:600;}
    .ai-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border);}
    .ai-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:13px;outline:none;}
    .ai-input::placeholder{color:var(--muted);}
    .ai-input:focus{border-color:var(--gold);}
    .ai-send{background:var(--gold);color:#111;border:none;border-radius:var(--radius-sm);width:40px;font-size:18px;cursor:pointer;font-weight:700;}
    .ai-send:disabled{opacity:0.4;cursor:not-allowed;}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
    .chip{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;}
    .form-field{margin-bottom:12px;}
    .form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:block;}
    .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;outline:none;}
    .form-input:focus{border-color:var(--gold);}
    .form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;outline:none;appearance:none;}
    .btn-primary{width:100%;background:var(--gold);color:#111;border:none;border-radius:var(--radius-sm);padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;}
    .btn-primary:active{opacity:0.85;} .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
    .center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px;text-align:center;}
    .center .icon{font-size:36px;}
    .center p{color:var(--muted);font-size:13px;}
    .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .success-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;animation:fadeUp 0.3s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
    .error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;gap:12px;}
    .error-screen h2{color:var(--red);font-size:18px;}
    .error-screen p{color:var(--muted);font-size:13px;line-height:1.6;}
  </style>
</head>
<body>
<div id="root"></div>
<script>
// ── Init Telegram Web App ─────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#181c27'); tg.setBackgroundColor('#0f1117'); }

// ── Get Telegram user — this is what makes the Mini App secure ──
const TG_USER = tg?.initDataUnsafe?.user;
const TG_ID   = TG_USER?.id ? String(TG_USER.id) : null;

// ── API helper — always sends Telegram ID in header ───────────
const API = window.location.origin;
async function api(path, opts = {}) {
  if (!TG_ID) throw new Error("Not opened inside Telegram");
  const res = await fetch(`${API}/mini${path}`, {
    headers: { 'Content-Type': 'application/json', 'x-tg-id': TG_ID },
    ...opts,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

const fmt = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const { useState, useEffect, useRef, useCallback } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

// ── Error screen if opened outside Telegram ───────────────────
function NotInTelegram() {
  return React.createElement('div', { className: 'error-screen' },
    React.createElement('div', { style:{fontSize:48} }, '📱'),
    React.createElement('h2', null, 'Open in Telegram'),
    React.createElement('p', null, 'ShopBoss must be opened from inside the Telegram app. Find your ShopBoss bot and tap /app to launch this dashboard.')
  );
}

// ── Dashboard Tab ─────────────────────────────────────────────
function Dashboard({ data, loading }) {
  if (loading) return React.createElement('div', { className:'center' },
    React.createElement('div', { className:'spinner' }),
    React.createElement('p', null, 'Loading dashboard…')
  );
  if (!data) return React.createElement('div', { className:'center' },
    React.createElement('div', { className:'icon' }, '📊'),
    React.createElement('p', null, 'No data yet. Add products and record sales to see your dashboard.')
  );
  const d = data.dashboard;
  return React.createElement('div', null,
    React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, "Today"),
      React.createElement('div', { className:'stat-grid' },
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Revenue'),
          React.createElement('div', { className:'stat-value gold' }, fmt(d.today.revenue)),
          React.createElement('div', { className:'stat-sub' }, `${d.today.count} sale(s)`)
        ),
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Profit'),
          React.createElement('div', { className:`stat-value ${d.today.profit>=0?'up':'down'}` }, fmt(d.today.profit)),
          React.createElement('div', { className:'stat-sub' }, 'gross today')
        )
      )
    ),
    React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'This Month'),
      React.createElement('div', { className:'stat-grid' },
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Revenue'),
          React.createElement('div', { className:'stat-value gold' }, fmt(d.month.revenue)),
          React.createElement('div', { className:'stat-sub' }, `${d.month.count} sales`)
        ),
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Net Profit'),
          React.createElement('div', { className:`stat-value ${d.netProfit>=0?'up':'down'}` }, fmt(d.netProfit)),
          React.createElement('div', { className:'stat-sub' }, 'after expenses')
        ),
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Expenses'),
          React.createElement('div', { className:'stat-value down' }, fmt(d.expenses.total)),
          React.createElement('div', { className:'stat-sub' }, `${d.expenses.count} entries`)
        ),
        React.createElement('div', { className:'stat-box' },
          React.createElement('div', { className:'stat-label' }, 'Stock Value'),
          React.createElement('div', { className:'stat-value' }, fmt(d.stockValue)),
          React.createElement('div', { className:'stat-sub' }, `${d.products.count} products`)
        )
      )
    ),
    data.topProducts?.length > 0 && React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Top Products'),
      React.createElement('div', { className:'chart-wrap' },
        React.createElement(ResponsiveContainer, { width:'100%', height:'100%' },
          React.createElement(BarChart, { data: data.topProducts, margin:{top:0,right:0,left:-20,bottom:0} },
            React.createElement(XAxis, { dataKey:'product_name', tick:{fill:'#7a8099',fontSize:10}, tickLine:false }),
            React.createElement(YAxis, { tick:{fill:'#7a8099',fontSize:10}, tickLine:false, axisLine:false,
              tickFormatter: v => v>=1000 ? '₦'+(v/1000).toFixed(0)+'k' : '₦'+v }),
            React.createElement(Tooltip, { formatter: v => fmt(v),
              contentStyle:{background:'#1e2435',border:'1px solid #2a3045',borderRadius:8,color:'#e8eaf0',fontSize:12} }),
            React.createElement(Bar, { dataKey:'total_revenue', fill:'#f5c518', radius:[4,4,0,0] })
          )
        )
      )
    ),
    d.lowStock > 0 && React.createElement('div', { className:'alert' },
      React.createElement('div', { className:'alert-icon' }, '⚠️'),
      React.createElement('div', { className:'alert-body' },
        React.createElement('div', { className:'alert-title' }, `${d.lowStock} item(s) low on stock`),
        React.createElement('div', { className:'alert-desc' }, 'Check Inventory tab to restock')
      )
    ),
    d.netProfit < 0 && d.month.revenue > 0 && React.createElement('div', { className:'alert' },
      React.createElement('div', { className:'alert-icon' }, '📉'),
      React.createElement('div', { className:'alert-body' },
        React.createElement('div', { className:'alert-title' }, 'Spending exceeds profit'),
        React.createElement('div', { className:'alert-desc' }, `Net loss: ${fmt(Math.abs(d.netProfit))} this month`)
      )
    )
  );
}

// ── Sales Tab ─────────────────────────────────────────────────
function Sales({ data, onRefresh }) {
  const [form, setForm] = useState({ product_name:'', quantity:'', sell_price:'', customer:'' });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState('');
  const products = data?.inventoryList || [];
  const recent   = data?.recentSales   || [];
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(''), 2500); };
  const submit = async () => {
    if (!form.product_name || !form.quantity || !form.sell_price) return;
    setSaving(true);
    try {
      await api('/sale', { method:'POST', body: JSON.stringify({
        product_name: form.product_name, quantity: parseFloat(form.quantity),
        sell_price: parseFloat(form.sell_price), customer: form.customer || null,
      })});
      setForm({ product_name:'', quantity:'', sell_price:'', customer:'' });
      showToast('✅ Sale recorded!');
      onRefresh();
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch(e) { showToast('❌ ' + e.message); }
    setSaving(false);
  };
  return React.createElement('div', null,
    toast && React.createElement('div', { className:'success-toast' }, toast),
    React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Record a Sale'),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Product'),
        products.length > 0
          ? React.createElement('select', { className:'form-select', value:form.product_name,
              onChange: e => setForm(f=>({...f, product_name:e.target.value})) },
              React.createElement('option', { value:'' }, '— Select product —'),
              ...products.map(p => React.createElement('option', { key:p.id, value:p.name }, `${p.name} (${p.stock} ${p.unit})`))
            )
          : React.createElement('input', { className:'form-input', placeholder:'Product name',
              value:form.product_name, onChange: e=>setForm(f=>({...f,product_name:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Quantity'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'1',
          value:form.quantity, onChange:e=>setForm(f=>({...f,quantity:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Selling Price (₦)'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'2500',
          value:form.sell_price, onChange:e=>setForm(f=>({...f,sell_price:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Customer (optional)'),
        React.createElement('input', { className:'form-input', placeholder:'Name or phone',
          value:form.customer, onChange:e=>setForm(f=>({...f,customer:e.target.value})) })
      ),
      React.createElement('button', { className:'btn-primary', onClick:submit,
        disabled: saving || !form.product_name || !form.quantity || !form.sell_price },
        saving ? 'Saving…' : 'Record Sale')
    ),
    recent.length > 0 && React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Recent Sales'),
      recent.slice(0,8).map((s,i) =>
        React.createElement('div', { className:'list-item', key:i },
          React.createElement('div', { className:'list-left' },
            React.createElement('div', { className:'list-name' }, s.product_name),
            React.createElement('div', { className:'list-meta' }, `Qty: ${s.quantity}${s.customer?' · '+s.customer:''}`)
          ),
          React.createElement('div', { className:'list-right' },
            React.createElement('div', { className:'list-amount gold' }, fmt(s.revenue)),
            React.createElement('div', { className:'list-meta' }, `profit: ${fmt(s.profit)}`)
          )
        )
      )
    )
  );
}

// ── Inventory Tab ─────────────────────────────────────────────
function Inventory({ data, onRefresh }) {
  const [form, setForm] = useState({ name:'', sell_price:'', cost_price:'', stock:'', unit:'unit' });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState('');
  const [view, setView] = useState('list');
  const products  = data?.inventoryList || [];
  const lowStock  = data?.lowStockItems || [];
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(''), 2500); };
  const submit = async () => {
    if (!form.name || !form.sell_price) return;
    setSaving(true);
    try {
      await api('/product', { method:'POST', body: JSON.stringify({
        name:form.name, sell_price:parseFloat(form.sell_price),
        cost_price:parseFloat(form.cost_price||0), stock:parseFloat(form.stock||0), unit:form.unit||'unit'
      })});
      setForm({ name:'', sell_price:'', cost_price:'', stock:'', unit:'unit' });
      setView('list'); showToast('✅ Product added!'); onRefresh();
    } catch(e) { showToast('❌ ' + e.message); }
    setSaving(false);
  };
  const btnStyle = (active) => ({ flex:1, background:active?'#f5c518':'#1e2435', color:active?'#111':'#7a8099', border:'1px solid #2a3045' });
  return React.createElement('div', null,
    toast && React.createElement('div', { className:'success-toast' }, toast),
    React.createElement('div', { style:{display:'flex',gap:8,marginBottom:12} },
      React.createElement('button', { className:'btn-primary', style:btnStyle(view==='list'), onClick:()=>setView('list') }, '📦 Products'),
      React.createElement('button', { className:'btn-primary', style:btnStyle(view==='add'), onClick:()=>setView('add') }, '➕ Add Product')
    ),
    view === 'list' && React.createElement('div', null,
      lowStock.length > 0 && React.createElement('div', { className:'card' },
        React.createElement('div', { className:'card-title' }, `⚠️ Low Stock (${lowStock.length})`),
        lowStock.map((p,i) =>
          React.createElement('div', { className:'list-item', key:i },
            React.createElement('div', { className:'list-left' },
              React.createElement('div', { className:'list-name' }, p.name),
              React.createElement('div', { className:'list-meta' }, `Min: ${p.min_stock} ${p.unit}`)
            ),
            React.createElement('div', { className:'list-right' },
              React.createElement('span', { className:'list-badge badge-red' }, `${p.stock} left`)
            )
          )
        )
      ),
      React.createElement('div', { className:'card' },
        React.createElement('div', { className:'card-title' }, `All Products (${products.length})`),
        products.length === 0
          ? React.createElement('div', { className:'center' }, React.createElement('p', null, 'No products yet. Tap "Add Product" to start.'))
          : products.map((p,i) =>
              React.createElement('div', { className:'list-item', key:i },
                React.createElement('div', { className:'list-left' },
                  React.createElement('div', { className:'list-name' }, p.name),
                  React.createElement('div', { className:'list-meta' }, `Cost: ${fmt(p.cost_price)} · Sell: ${fmt(p.sell_price)}`)
                ),
                React.createElement('div', { className:'list-right' },
                  React.createElement('span', { className:`list-badge ${p.stock<=p.min_stock?'badge-red':'badge-green'}` }, `${p.stock} ${p.unit}`)
                )
              )
            )
      )
    ),
    view === 'add' && React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Add New Product'),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Product Name'),
        React.createElement('input', { className:'form-input', placeholder:'e.g. Coca-Cola',
          value:form.name, onChange:e=>setForm(f=>({...f,name:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Selling Price (₦)'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'500',
          value:form.sell_price, onChange:e=>setForm(f=>({...f,sell_price:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Cost Price (₦)'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'300',
          value:form.cost_price, onChange:e=>setForm(f=>({...f,cost_price:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Stock Quantity'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'50',
          value:form.stock, onChange:e=>setForm(f=>({...f,stock:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Unit'),
        React.createElement('input', { className:'form-input', placeholder:'pieces / kg / litres / cartons',
          value:form.unit, onChange:e=>setForm(f=>({...f,unit:e.target.value})) })
      ),
      React.createElement('button', { className:'btn-primary', onClick:submit,
        disabled: saving || !form.name || !form.sell_price },
        saving ? 'Saving…' : 'Add Product')
    )
  );
}

// ── Expenses Tab ──────────────────────────────────────────────
function ExpensesTab({ data, onRefresh }) {
  const [form, setForm] = useState({ description:'', amount:'', category:'General' });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState('');
  const cats   = ['General','Utilities','Transport','Stock/Supply','Operations','Marketing','Payroll','Other'];
  const recent = data?.recentExpenses   || [];
  const expCat = data?.expenseBreakdown || [];
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(''), 2500); };
  const submit = async () => {
    if (!form.description || !form.amount) return;
    setSaving(true);
    try {
      await api('/expense', { method:'POST', body: JSON.stringify({ description:form.description, amount:parseFloat(form.amount), category:form.category })});
      setForm({ description:'', amount:'', category:'General' });
      showToast('✅ Expense recorded!'); onRefresh();
    } catch(e) { showToast('❌ '+e.message); }
    setSaving(false);
  };
  return React.createElement('div', null,
    toast && React.createElement('div', { className:'success-toast' }, toast),
    React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Record Expense'),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Description'),
        React.createElement('input', { className:'form-input', placeholder:'e.g. Generator fuel',
          value:form.description, onChange:e=>setForm(f=>({...f,description:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Amount (₦)'),
        React.createElement('input', { className:'form-input', type:'number', placeholder:'5000',
          value:form.amount, onChange:e=>setForm(f=>({...f,amount:e.target.value})) })
      ),
      React.createElement('div', { className:'form-field' },
        React.createElement('label', { className:'form-label' }, 'Category'),
        React.createElement('select', { className:'form-select', value:form.category, onChange:e=>setForm(f=>({...f,category:e.target.value})) },
          ...cats.map(c => React.createElement('option', { key:c, value:c }, c))
        )
      ),
      React.createElement('button', { className:'btn-primary', onClick:submit,
        disabled: saving || !form.description || !form.amount },
        saving ? 'Saving…' : 'Record Expense')
    ),
    expCat.length > 0 && React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'This Month by Category'),
      expCat.map((c,i) =>
        React.createElement('div', { className:'list-item', key:i },
          React.createElement('div', { className:'list-left' }, React.createElement('div', { className:'list-name' }, c.category)),
          React.createElement('div', { className:'list-right' }, React.createElement('div', { className:'list-amount down' }, fmt(c.total)))
        )
      )
    ),
    recent.length > 0 && React.createElement('div', { className:'card' },
      React.createElement('div', { className:'card-title' }, 'Recent Expenses'),
      recent.slice(0,8).map((e,i) =>
        React.createElement('div', { className:'list-item', key:i },
          React.createElement('div', { className:'list-left' },
            React.createElement('div', { className:'list-name' }, e.description),
            React.createElement('div', { className:'list-meta' }, e.category)
          ),
          React.createElement('div', { className:'list-right' },
            React.createElement('div', { className:'list-amount down' }, fmt(e.amount))
          )
        )
      )
    )
  );
}

// ── AI Chat Tab ───────────────────────────────────────────────
function AiChat() {
  const [messages, setMessages] = useState([{ role:'bot', text:"Hi! I'm ShopBoss AI. Ask me anything about your business." }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const QUICK = ["How much did I make today?","What products are low in stock?","What's my profit this month?","Give me business advice"];
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);
  const send = async text => {
    const q = text || input.trim();
    if (!q || loading) return;
    setInput('');
    setMessages(m => [...m, { role:'user', text:q }]);
    setLoading(true);
    try {
      const res = await api('/ask', { method:'POST', body: JSON.stringify({ question:q }) });
      setMessages(m => [...m, { role:'bot', text:res.answer }]);
    } catch {
      setMessages(m => [...m, { role:'bot', text:"⚠️ Couldn't reach the AI right now. Please try again." }]);
    }
    setLoading(false);
  };
  return React.createElement('div', { className:'ai-wrap' },
    React.createElement('div', { className:'ai-messages' },
      React.createElement('div', { className:'chips' },
        ...QUICK.map(q => React.createElement('div', { className:'chip', key:q, onClick:()=>send(q) }, q))
      ),
      ...messages.map((m,i) =>
        React.createElement('div', { className:`ai-bubble ${m.role}`, key:i },
          React.createElement('div', { className:'ai-name' }, m.role==='bot'?'🤖 ShopBoss':'👤 You'),
          React.createElement('div', { className:'ai-bubble-inner' }, m.text)
        )
      ),
      loading && React.createElement('div', { className:'ai-bubble bot' },
        React.createElement('div', { className:'ai-name' }, '🤖 ShopBoss'),
        React.createElement('div', { className:'ai-bubble-inner' }, '…')
      ),
      React.createElement('div', { ref:bottomRef })
    ),
    React.createElement('div', { className:'ai-input-row' },
      React.createElement('input', { className:'ai-input', placeholder:'Ask about your business…',
        value:input, onChange:e=>setInput(e.target.value), onKeyDown:e=>e.key==='Enter'&&send() }),
      React.createElement('button', { className:'ai-send', onClick:()=>send(), disabled:loading||!input.trim() }, '↑')
    )
  );
}

// ── Root App ──────────────────────────────────────────────────
function App() {
  // If not inside Telegram, show error screen immediately
  if (!TG_ID) return React.createElement(NotInTelegram);

  const [tab, setTab]     = useState('dashboard');
  const [data, setData]   = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const res = await api('/data');
      setData(res);
      setError(null);
    } catch(e) {
      setError(e.message);
    }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const TABS = [
    { id:'dashboard', label:'📊 Dashboard' },
    { id:'sales',     label:'💰 Sales' },
    { id:'inventory', label:'📦 Inventory' },
    { id:'expenses',  label:'💸 Expenses' },
    { id:'ai',        label:'🤖 AI' },
  ];

  return React.createElement('div', { id:'root' },
    React.createElement('div', { className:'app-header' },
      React.createElement('h1', null, 'ShopBoss'),
      React.createElement('p', null, data?.businessName || (TG_USER?.first_name ? `${TG_USER.first_name}'s Business` : 'My Business'))
    ),
    React.createElement('div', { className:'tab-bar' },
      ...TABS.map(t =>
        React.createElement('button', { key:t.id, className:`tab ${tab===t.id?'active':''}`, onClick:()=>setTab(t.id) }, t.label)
      )
    ),
    error && React.createElement('div', { style:{padding:16} },
      React.createElement('div', { className:'alert' },
        React.createElement('div', { className:'alert-icon' }, '⚠️'),
        React.createElement('div', { className:'alert-body' },
          React.createElement('div', { className:'alert-title' }, 'Connection error'),
          React.createElement('div', { className:'alert-desc' }, error)
        )
      )
    ),
    React.createElement('div', { className:'page' },
      tab==='dashboard' && React.createElement(Dashboard, { data, loading }),
      tab==='sales'     && React.createElement(Sales,     { data, onRefresh:load }),
      tab==='inventory' && React.createElement(Inventory, { data, onRefresh:load }),
      tab==='expenses'  && React.createElement(ExpensesTab,{ data, onRefresh:load }),
      tab==='ai'        && React.createElement(AiChat)
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
