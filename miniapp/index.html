<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070B12"/>
<title>ShopBoss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --c60:#070B12;--c30:#0F1923;--c30b:#141F2E;--c30c:#1A2840;
  --rim:#1E3050;--wire:#243D5A;--dim:#3A5070;
  --gold:#E8A020;--gold3:#C07818;--green:#0FB981;--red:#F04060;
  --text:#EDF0F7;--sub:#7A90AA;
  --disp:'Space Grotesk','SF Pro Text',-apple-system,sans-serif;
  --body:'Inter',-apple-system,sans-serif;
  --nav-h:60px;--hdr-h:58px;
}
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

html,body{height:100%;overflow:hidden;background:var(--c60)}
body{color:var(--text);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* HEADER */
.hdr{flex-shrink:0;height:var(--hdr-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--c30);border-bottom:1px solid var(--rim);padding-top:env(safe-area-inset-top,0)}
.hdr-brand{display:flex;align-items:center;gap:9px}
.hdr-logo{width:33px;height:33px;border-radius:9px;background:linear-gradient(135deg,var(--gold3),var(--gold));display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;font-family:var(--disp);color:#0A0800;flex-shrink:0}
.hdr-name{font-family:var(--disp);font-size:16px;font-weight:800;color:var(--gold);letter-spacing:-.3px}
.hdr-biz{font-size:11px;color:var(--sub);margin-top:1px}
.hdr-badge{background:rgba(15,185,129,.15);color:var(--green);border:1px solid rgba(15,185,129,.3);font-family:var(--disp);font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}

/* SCREENS */
.content{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .18s}
.screen.active{opacity:1;pointer-events:all}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.scroll::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
.nav{flex-shrink:0;display:flex;background:var(--c30);border-top:1px solid var(--rim);padding-bottom:env(safe-area-inset-bottom,0)}
.ntab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;border:none;background:none;color:var(--dim);font-family:var(--disp);font-size:8.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:color .15s;min-height:var(--nav-h)}
.ntab .ni{font-size:20px;line-height:1;transition:transform .18s}
.ntab.active{color:var(--gold)}
.ntab.active .ni{transform:scale(1.18)}

/* ATOMS */
.card{background:var(--c30);border:1px solid var(--rim);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card-title{padding:12px 14px 0;font-family:var(--disp);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--sub)}
.card-body{padding:12px 14px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{background:var(--c30b);border:1px solid var(--rim);border-radius:11px;padding:13px 11px}
.sl{font-family:var(--disp);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.sv{font-family:var(--disp);font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.5px;line-height:1}
.ss{font-size:10px;color:var(--sub);margin-top:3px}
.cg{color:var(--gold)}.cgr{color:var(--green)}.cr{color:var(--red)}
.rlist .rrow{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--rim)}
.rlist .rrow:last-child{border-bottom:none;padding-bottom:0}
.rlist .rrow:first-child{padding-top:0}
.rrow-l{flex:1;min-width:0}
.rrow-name{font-family:var(--disp);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow-sub{font-size:11px;color:var(--sub);margin-top:1px}
.rrow-r{text-align:right;flex-shrink:0;margin-left:10px}
.rrow-val{font-family:var(--disp);font-weight:700;font-size:13px}
.badge{font-family:var(--disp);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.bg-green{background:rgba(15,185,129,.15);color:var(--green)}
.bg-red{background:rgba(240,64,96,.15);color:var(--red)}
.bg-gold{background:rgba(232,160,32,.15);color:var(--gold)}
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:11px;margin-bottom:8px;border:1px solid}
.alert.warn{background:rgba(240,160,32,.07);border-color:rgba(240,160,32,.22)}
.alert.danger{background:rgba(240,64,96,.07);border-color:rgba(240,64,96,.22)}
.alert-ico{font-size:18px;flex-shrink:0;line-height:1.3}
.alert-title{font-family:var(--disp);font-weight:700;font-size:13px}
.alert-desc{font-size:11px;color:var(--sub);margin-top:2px}
.bchart{display:flex;align-items:flex-end;gap:5px;height:80px;padding-top:4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bfill{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold3));min-height:4px}
.blabel{font-family:var(--disp);font-size:9px;color:var(--sub);text-align:center;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* FORMS */
.fg{margin-bottom:12px}
.fl{display:block;font-family:var(--disp);font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fi,.fsel{width:100%;background:var(--c30b);border:1.5px solid var(--rim);border-radius:9px;padding:11px 13px;color:var(--text);font-size:16px;font-family:var(--body);outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus,.fsel:focus{border-color:var(--gold)}
.fi::placeholder{color:var(--dim)}
.fta{width:100%;background:var(--c30b);border:1.5px solid var(--rim);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;font-family:var(--body);outline:none;resize:none;min-height:80px;transition:border-color .15s}
.fta:focus{border-color:var(--gold)}
.fta::placeholder{color:var(--dim)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border-radius:9px;font-family:var(--disp);font-weight:700;font-size:14px;cursor:pointer;border:none;transition:all .15s;margin-top:4px;letter-spacing:.2px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800}
.btn-gold:active{opacity:.85;transform:scale(.98)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--c30b);color:var(--text);border:1.5px solid var(--rim)}
.btn-ghost:active{background:var(--c30c)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;margin-top:0;border-radius:7px}
.pills{display:flex;gap:0;background:var(--c30b);border:1px solid var(--rim);border-radius:9px;padding:3px;margin-bottom:12px}
.pill-btn{flex:1;padding:8px;border-radius:7px;border:none;background:none;color:var(--sub);font-family:var(--disp);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.pill-btn.on{background:var(--c30);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* MARKETPLACE */
.vendor-card{background:var(--c30);border:1px solid var(--rim);border-radius:14px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color .18s}
.vendor-card:active{border-color:var(--gold)}
.vendor-card-top{padding:14px 14px 10px;display:flex;align-items:flex-start;gap:12px}
.vendor-av{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,var(--c30c),var(--c30b));border:1px solid var(--rim);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.vendor-info{flex:1;min-width:0}
.vendor-name{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vendor-ind{font-size:11px;color:var(--sub);margin-top:2px}
.vendor-rating{display:flex;align-items:center;gap:4px;margin-top:4px}
.stars{color:var(--gold);font-size:11px;letter-spacing:1px}
.star-count{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--gold)}
.rev-count{font-size:10px;color:var(--sub)}
.vendor-card-bottom{padding:0 14px 13px;font-size:12px;color:var(--sub);line-height:1.55}
.vendor-card-footer{padding:8px 14px;background:var(--c30b);border-top:1px solid var(--rim);display:flex;align-items:center;justify-content:space-between}
.vendor-loc{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:4px}
.vendor-phone{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--gold)}

/* VENDOR DETAIL PANEL */
.panel{position:absolute;inset:0;background:var(--c60);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.panel.open{transform:translateX(0)}
.panel-hdr{flex-shrink:0;height:var(--hdr-h);display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--c30);border-bottom:1px solid var(--rim);padding-top:env(safe-area-inset-top,0)}
.back-btn{width:34px;height:34px;border-radius:9px;background:var(--c30b);border:1px solid var(--rim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;cursor:pointer;border:none}
.panel-title{font-family:var(--disp);font-size:15px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0))}
.panel-scroll::-webkit-scrollbar{display:none}

/* STAR RATING INPUT */
.star-input{display:flex;gap:8px;margin-bottom:14px}
.star-input .s{font-size:30px;cursor:pointer;transition:transform .12s;opacity:.35;line-height:1}
.star-input .s.on{opacity:1;transform:scale(1.1)}
.star-input .s:active{transform:scale(.95)}

/* REVIEW CARD */
.review-item{padding:12px 0;border-bottom:1px solid var(--rim)}
.review-item:last-child{border-bottom:none}
.review-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.reviewer-name{font-family:var(--disp);font-weight:700;font-size:13px}
.review-stars{color:var(--gold);font-size:11px}
.review-text{font-size:13px;color:var(--sub);line-height:1.6}
.review-date{font-size:10px;color:var(--dim);margin-top:4px}

/* FILTER SCROLL */
.filter-row{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:7px 14px;border-radius:99px;border:1.5px solid var(--rim);background:var(--c30b);color:var(--sub);font-family:var(--disp);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.filter-chip.on{border-color:var(--gold);background:rgba(232,160,32,.1);color:var(--gold)}

/* AI CHAT */
.chat-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chat-area::-webkit-scrollbar{display:none}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
.chip{background:var(--c30b);border:1px solid var(--rim);border-radius:99px;padding:7px 13px;font-family:var(--disp);font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip:active{background:var(--c30c);color:var(--text)}
.bubble{max-width:86%}
.bubble.me{align-self:flex-end}
.bubble.bot{align-self:flex-start}
.bubble-who{font-family:var(--disp);font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:700}
.bubble-body{padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.55}
.bubble.bot .bubble-body{background:var(--c30b);border:1px solid var(--rim);border-bottom-left-radius:4px}
.bubble.me .bubble-body{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:600;border-bottom-right-radius:4px}
.td{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.chat-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));background:var(--c30);border-top:1px solid var(--rim)}
.chat-inp{flex:1;background:var(--c30b);border:1.5px solid var(--rim);border-radius:99px;padding:10px 16px;color:var(--text);font-size:14px;font-family:var(--body);outline:none;transition:border-color .15s}
.chat-inp:focus{border-color:var(--gold)}
.chat-inp::placeholder{color:var(--dim)}
.chat-send{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-size:18px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-family:var(--disp)}
.chat-send:disabled{opacity:.35;cursor:not-allowed}

/* STATES */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:52px 24px;text-align:center;flex:1}
.state-ico{font-size:40px;line-height:1}
.state-title{font-family:var(--disp);font-weight:700;font-size:16px}
.state-desc{font-size:13px;color:var(--sub);line-height:1.65;max-width:240px}
.spin{width:26px;height:26px;border:3px solid var(--rim);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0) + 12px);left:50%;transform:translateX(-50%) translateY(4px);padding:9px 18px;border-radius:99px;font-family:var(--disp);font-size:13px;font-weight:700;white-space:nowrap;z-index:999;opacity:0;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}
.no-tg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:14px}
.no-tg .big{font-size:52px}
.no-tg h2{font-family:var(--disp);font-size:20px;font-weight:800;color:var(--gold)}
.no-tg p{font-size:14px;color:var(--sub);line-height:1.7;max-width:290px}
.no-tg a{display:inline-flex;align-items:center;gap:7px;margin-top:8px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none}
@media(max-width:360px){.sv{font-size:17px}.ntab{font-size:8px}}
@media(min-width:600px){#app{max-width:460px;margin:0 auto}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';

/* ── TELEGRAM ──────────────────────────────────────────────── */
const tg      = window.Telegram?.WebApp;
const TG_USER = tg?.initDataUnsafe?.user || null;
const TG_ID   = TG_USER?.id ? String(TG_USER.id) : null;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.('#0F1923'); tg.setBackgroundColor?.('#070B12'); tg.enableClosingConfirmation?.(); }

/* ── HELPERS ───────────────────────────────────────────────── */
const fmt = n => '₦' + Number(n||0).toLocaleString('en-NG');
const mk  = (tag, cls) => Object.assign(document.createElement(tag||'div'), { className: cls||'' });
const IND_EM = {'Agriculture':'🌾','Logistics':'🚚','Shipping':'🚢','Warehousing':'📦','Manufacturing':'🏭','Retail':'🏪','Wholesale':'🤝','Pharmacy':'💊','Fashion':'👗','Food & Beverage':'🍕','Tech & Repairs':'🔧','Energy':'⚡','Construction':'🏗️','Beauty':'💇','Education':'🎓','Hospitality':'🏨','Agro-Processing':'🚜','Printing':'🖨️','Security':'🛡️','Healthcare':'⚕️','Auto & Transport':'🚗','ICT':'💻','Finance':'🏦','Export/Import':'🌍'};
function starsStr(r){ const n=Math.round(r||0); return '★'.repeat(Math.max(0,Math.min(5,n)))+'☆'.repeat(Math.max(0,5-n)); }

let toastTimer;
function toast(msg, type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`toast show ${type}`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}

async function api(path, opts={}){
  if (!TG_ID) throw new Error('Not in Telegram');
  const r = await fetch(window.location.origin+'/mini'+path, {
    headers:{'Content-Type':'application/json','x-tg-id':TG_ID}, ...opts,
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error||`Error ${r.status}`);
  return d;
}

/* ── STATE ─────────────────────────────────────────────────── */
let S = {
  tab:'dash', data:null, loading:true, err:null,
  invView:'list',
  chat:[{role:'bot',text:'Hi! Ask me anything about your business.'}], chatBusy:false,
  vendors:[], vendorsLoading:false, vendorFilter:'All',
  activeVendor:null, vendorReviews:[], hasReviewed:false, reviewStar:0,
};

/* ── RENDER: DASHBOARD ─────────────────────────────────────── */
function renderDash(){
  const scr=document.getElementById('s-dash'); scr.innerHTML='';
  if(S.loading){ const b=mk('div','state-box'); b.innerHTML='<div class="spin"></div><div class="state-desc">Loading…</div>'; scr.appendChild(b); return; }
  if(S.err||!S.data){ const b=mk('div','state-box'); b.innerHTML=`<div class="state-ico">⚠️</div><div class="state-title">Could not load</div><div class="state-desc">${S.err||'No data yet.'}</div>`; const rb=mk('button','btn btn-gold'); rb.style.maxWidth='160px'; rb.textContent='Retry'; rb.onclick=()=>loadData(); b.appendChild(rb); scr.appendChild(b); return; }
  const sc=mk('div','scroll'); const d=S.data.dashboard; const prods=S.data.topProducts||[];

  const tc=mk('div','card'); tc.innerHTML='<div class="card-title">Today</div>';
  const tb=mk('div','card-body g2');
  tb.innerHTML=`<div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.today.revenue)}</div><div class="ss">${d.today.count} sale(s)</div></div><div class="sbox"><div class="sl">Profit</div><div class="sv ${d.today.profit>=0?'cgr':'cr'}">${fmt(d.today.profit)}</div><div class="ss">gross today</div></div>`;
  tc.appendChild(tb);

  const mc=mk('div','card'); mc.innerHTML='<div class="card-title">This Month</div>';
  const mb=mk('div','card-body g2');
  mb.innerHTML=`<div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.month.revenue)}</div><div class="ss">${d.month.count} sales</div></div><div class="sbox"><div class="sl">Net Profit</div><div class="sv ${d.netProfit>=0?'cgr':'cr'}">${fmt(d.netProfit)}</div><div class="ss">after expenses</div></div><div class="sbox"><div class="sl">Expenses</div><div class="sv cr">${fmt(d.expenses.total)}</div><div class="ss">${d.expenses.count} entries</div></div><div class="sbox"><div class="sl">Stock Value</div><div class="sv">${fmt(d.stockValue)}</div><div class="ss">${d.products.count} products</div></div>`;
  mc.appendChild(mb);

  if(prods.length){
    const cc=mk('div','card'); cc.innerHTML='<div class="card-title">Top Products</div>';
    const cb=mk('div','card-body'); const chart=mk('div','bchart');
    const mx=Math.max(...prods.map(p=>p.total_revenue));
    prods.forEach(p=>{ const h=mx>0?Math.max(6,Math.round((p.total_revenue/mx)*74)):6; const col=mk('div','bcol'); const bar=mk('div','bfill'); bar.style.height=h+'px'; const lbl=mk('div','blabel'); lbl.textContent=p.product_name.length>8?p.product_name.slice(0,7)+'…':p.product_name; col.appendChild(bar); col.appendChild(lbl); chart.appendChild(col); });
    cb.appendChild(chart); cc.appendChild(cb); sc.appendChild(cc);
  }

  const alerts=mk('div');
  if(d.lowStock>0){ const a=mk('div','alert warn'); a.innerHTML=`<div class="alert-ico">⚠️</div><div><div class="alert-title">${d.lowStock} item(s) low on stock</div><div class="alert-desc">Check Inventory tab</div></div>`; alerts.appendChild(a); }

function setStar(n){
  S.reviewStar=n;

    s.classList.toggle('on', i<n);
  });

async function submitReview(vendorId){
  if(!S.reviewStar) return toast('Tap a star to rate first','err');
  const comment=document.getElementById('review-text')?.value?.trim();
  if(!comment||comment.length<5) return toast('Write at least a few words','err');
  const btn=document.getElementById('review-btn');
  btn.disabled=true; btn.textContent='Submitting…';
  try{
    const d=await api(`/vendor/${vendorId}/review`,{method:'POST',body:JSON.stringify({rating:S.reviewStar,comment})});
    S.hasReviewed=true;
    toast(d.updated?'✅ Review updated!':'✅ Review submitted!');
    tg?.HapticFeedback?.notificationOccurred('success');
    // Refresh vendor detail
    const fresh=await api(`/vendor/${vendorId}`);
    S.vendorReviews=fresh.reviews||[];
    S.activeVendor={...S.activeVendor,rating:fresh.vendor.rating,review_count:fresh.vendor.review_count};
    renderVendorPanel(fresh.vendor);
    // Refresh list
    await loadVendors();
  } catch(e){ toast(e.message,'err'); }
  const btn2=document.getElementById('review-btn');
  if(btn2){ btn2.disabled=false; btn2.textContent='⭐ '+(S.hasReviewed?'Update Review':'Submit Review'); }
}

async function loadVendors(){
  S.vendorsLoading=true;
  renderMarket();
  try{
    const d=await api('/marketplace'+(S.vendorFilter!=='All'?`?industry=${encodeURIComponent(S.vendorFilter)}`:''));
    S.vendors=d.vendors||[];
  } catch(e){ S.vendors=[]; }
  S.vendorsLoading=false;
  renderMarket();
}

function renderChat(){
  const scr=document.getElementById('s-ai'); if(!scr) return;
  scr.innerHTML=''; scr.style.cssText='display:flex;flex-direction:column;overflow:hidden;position:absolute;inset:0';
  const chips=mk('div','chips-row');
  ['How much did I make today?','What stock is low?',"This month's profit?",'Give me advice'].forEach(q=>{ const c=mk('div','chip'); c.textContent=q; c.onclick=()=>sendChat(q); chips.appendChild(c); });
  const area=mk('div','chat-area'); area.id='chat-area';
  const bar=mk('div','chat-bar'); const inp=document.createElement('input'); inp.type='text'; inp.className='chat-inp'; inp.id='chat-inp'; inp.placeholder='Ask about your business…'; inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } };
  const send=mk('button','chat-send'); send.id='chat-send'; send.innerHTML='↑'; send.onclick=()=>sendChat();
  bar.appendChild(inp); bar.appendChild(send);
  scr.appendChild(chips); scr.appendChild(area); scr.appendChild(bar);
  renderMessages();
}
function renderMessages(){
  const area=document.getElementById('chat-area'); if(!area) return; area.innerHTML='';
  S.chat.forEach(m=>{ const b=mk('div',`bubble ${m.role==='bot'?'bot':'me'}`); const who=mk('div','bubble-who'); who.textContent=m.role==='bot'?'🤖 ShopBoss':'👤 You'; const body=mk('div','bubble-body'); body.innerHTML=m.text.replace(/\n/g,'<br/>'); b.appendChild(who); b.appendChild(body); area.appendChild(b); });
  if(S.chatBusy){ const b=mk('div','bubble bot'); const who=mk('div','bubble-who'); who.textContent='🤖 ShopBoss'; const body=mk('div','bubble-body'); body.innerHTML='<span class="td"></span><span class="td"></span><span class="td"></span>'; b.appendChild(who); b.appendChild(body); area.appendChild(b); }
  area.scrollTop=area.scrollHeight;
}
async function sendChat(preset){
  const inp=document.getElementById('chat-inp'); const text=preset||inp?.value?.trim();
  if(!text||S.chatBusy) return;
  if(inp&&!preset) inp.value='';
  S.chat.push({role:'user',text}); S.chatBusy=true; renderMessages();
  try{ const res=await api('/ask',{method:'POST',body:JSON.stringify({question:text})}); S.chat.push({role:'bot',text:res.answer}); }
  catch(e){ S.chat.push({role:'bot',text:'⚠️ '+e.message}); }
  S.chatBusy=false; renderMessages();
}

const TABS=['dash','sales','inv','exp','market','ai'];
function switchTab(id){
  S.tab=id;
  TABS.forEach(t=>{ document.getElementById('s-'+t)?.classList.toggle('active',t===id); document.getElementById('t-'+t)?.classList.toggle('active',t===id); });
  renderTab(id);
  if(id==='market'&&!S.vendors.length) loadVendors();
}
function renderTab(id){
  if(id==='dash') renderDash();
  if(id==='sales') renderSales();
  if(id==='inv') renderInv();
  if(id==='exp') renderExp();
  if(id==='market') renderMarket();
  if(id==='ai') renderChat();
}

/* ── DATA ──────────────────────────────────────────────────── */
async function loadData(){
  try{ const res=await api('/data'); S.data=res; S.loading=false; S.err=null; const bn=document.getElementById('biz-name'); if(bn&&res.businessName) bn.textContent=res.businessName; }
  catch(e){ S.loading=false; S.err=e.message; }
  renderTab(S.tab);
}

/* ── BOOT ──────────────────────────────────────────────────── */
function boot(){
  const app=document.getElementById('app');
  if(!TG_ID){
    app.innerHTML=`<div class="no-tg"><div class="big">📱</div><h2>Open in Telegram</h2><p>ShopBoss must be opened inside Telegram. Find @AiBizRepoBot and send /app.</p><a href="https://t.me/AiBizRepoBot">Open ShopBoss →</a></div>`;
    return;
  }
  const bizName=TG_USER?.first_name?`${TG_USER.first_name}'s Business`:'My Business';
  app.innerHTML=`
    <div class="hdr">
      <div class="hdr-brand">
        <div class="hdr-logo">S</div>
        <div><div class="hdr-name">ShopBoss</div><div class="hdr-biz" id="biz-name">${bizName}</div></div>
      </div>
      <div class="hdr-badge">● LIVE</div>
    </div>
    <div class="content">
      <div class="screen active" id="s-dash"></div>
      <div class="screen" id="s-sales"></div>
      <div class="screen" id="s-inv"></div>
      <div class="screen" id="s-exp"></div>
      <div class="screen" id="s-market"></div>
      <div class="screen" id="s-ai"></div>
    </div>
    <nav class="nav">
      <button class="ntab active" id="t-dash" onclick="switchTab('dash')"><span class="ni">📊</span>Dashboard</button>
      <button class="ntab" id="t-sales" onclick="switchTab('sales')"><span class="ni">💰</span>Sales</button>
      <button class="ntab" id="t-inv" onclick="switchTab('inv')"><span class="ni">📦</span>Stock</button>
      <button class="ntab" id="t-exp" onclick="switchTab('exp')"><span class="ni">💸</span>Expenses</button>
      <button class="ntab" id="t-market" onclick="switchTab('market')"><span class="ni">🛍️</span>Market</button>
      <button class="ntab" id="t-ai" onclick="switchTab('ai')"><span class="ni">🤖</span>AI</button>
    </nav>`;
  renderDash();
  loadData();
}
boot();
</script>
