<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0d1220"/>
<title>ShopBoss</title>

<!-- MUST be first script — Telegram SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ═══════════════════════════════════════
   RESET & TOKENS
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:       #0d1220;
  --s1:       #131929;
  --s2:       #182036;
  --s3:       #1e2840;
  --rim:      #263045;
  --wire:     #32405a;
  --gold:     #f0b429;
  --gold-lt:  #ffd166;
  --gold-dk:  #c8931f;
  --green:    #10b981;
  --red:      #f43f5e;
  --blue:     #60a5fa;
  --purple:   #a78bfa;
  --amber:    #fbbf24;
  --text:     #eef1f8;
  --sub:      #8896b0;
  --dim:      #4a5870;
  --r:        16px;
  --r2:       12px;
  --r3:       8px;
  --nav-h:    60px;
  --hdr-h:    58px;
  --safe-b:   env(safe-area-inset-bottom, 0px);
}

html{height:100%;overflow:hidden;background:var(--bg)}
body{
  height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  overflow:hidden;
}

/* ── Header ───────────────────────────── */
.hdr{
  flex-shrink:0;
  height:var(--hdr-h);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--s1);
  border-bottom:1px solid var(--rim);
  padding-top:env(safe-area-inset-top,0);
}
.hdr-brand{display:flex;align-items:center;gap:8px}
.hdr-logo{
  width:32px;height:32px;border-radius:var(--r3);
  background:linear-gradient(135deg,var(--gold-dk),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.hdr-name{font-weight:800;font-size:16px;color:var(--gold);letter-spacing:-.3px}
.hdr-biz{font-size:11px;color:var(--sub);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-badge{
  background:rgba(16,185,129,.15);color:var(--green);
  border:1px solid rgba(16,185,129,.3);
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:3px 8px;border-radius:99px;
}
.hdr-btn{
  width:34px;height:34px;border-radius:var(--r3);
  background:var(--s2);border:1px solid var(--rim);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;
}

/* ── Tab content area ─────────────────── */
.content{
  flex:1;overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
}

/* ── Screens ──────────────────────────── */
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.screen.active{opacity:1;pointer-events:all}

/* ── Scroll areas ─────────────────────── */
.scroll{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px 14px calc(14px + var(--safe-b));
}
.scroll::-webkit-scrollbar{display:none}

/* ── Bottom nav ───────────────────────── */
.nav{
  flex-shrink:0;
  display:flex;
  background:var(--s1);
  border-top:1px solid var(--rim);
  padding-bottom:var(--safe-b);
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  padding:8px 4px;
  border:none;background:none;
  color:var(--dim);
  font-size:9px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;
  cursor:pointer;transition:color .15s;
  min-height:var(--nav-h);
}
.nav-tab .ni{font-size:22px;line-height:1;transition:transform .2s}
.nav-tab.active{color:var(--gold)}
.nav-tab.active .ni{transform:scale(1.15)}

/* ═══════════════════════════════════════
   DESIGN ATOMS
═══════════════════════════════════════ */

/* Cards */
.card{
  background:var(--s1);border:1px solid var(--rim);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;
}
.card-title{
  padding:12px 14px 0;
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;color:var(--sub);
}
.card-body{padding:12px 14px 14px}
.card-body.pt0{padding-top:0}

/* Stat grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Stat box */
.sbox{
  background:var(--s2);border:1px solid var(--rim);
  border-radius:var(--r2);padding:12px 10px;
}
.sl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.sv{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.5px;line-height:1}
.ss{font-size:10px;color:var(--sub);margin-top:3px}
.cg{color:var(--gold)} .cgr{color:var(--green)} .cr{color:var(--red)} .cb{color:var(--blue)}

/* Alert */
.alert{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;margin-bottom:8px;border-radius:var(--r2);
  border:1px solid;
}
.alert.warn{background:rgba(251,191,36,.07);border-color:rgba(251,191,36,.25)}
.alert.danger{background:rgba(244,63,94,.07);border-color:rgba(244,63,94,.25)}
.alert.info{background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.2)}
.alert-ico{font-size:18px;flex-shrink:0;line-height:1.2}
.alert-title{font-weight:700;font-size:13px}
.alert-desc{font-size:11px;color:var(--sub);margin-top:2px}

/* Row list */
.rlist{}
.rrow{
  display:flex;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--rim);
}
.rrow:last-child{border-bottom:none;padding-bottom:0}
.rrow:first-child{padding-top:0}
.rrow-l{flex:1;min-width:0}
.rrow-name{
  font-weight:600;font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rrow-sub{font-size:11px;color:var(--sub);margin-top:1px}
.rrow-r{text-align:right;flex-shrink:0;margin-left:12px}
.rrow-val{font-weight:700;font-size:13px}

/* Badge */
.badge{
  display:inline-block;
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:99px;
}
.bg-green{background:rgba(16,185,129,.15);color:var(--green)}
.bg-red{background:rgba(244,63,94,.15);color:var(--red)}
.bg-gold{background:rgba(240,180,41,.15);color:var(--gold)}
.bg-blue{background:rgba(96,165,250,.15);color:var(--blue)}
.bg-purple{background:rgba(167,139,250,.15);color:var(--purple)}

/* Bar chart */
.bchart{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bfill{
  width:100%;border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,var(--gold),var(--gold-dk));
  min-height:4px;transition:height .5s ease;
}
.blabel{
  font-size:9px;color:var(--sub);
  text-align:center;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Divider */
.div{border:none;border-top:1px solid var(--rim);margin:12px 0}

/* Section label */
.sec-label{
  font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.8px;
  color:var(--sub);margin-bottom:8px;
}

/* ═══════════════════════════════════════
   FORMS
═══════════════════════════════════════ */
.fgroup{margin-bottom:12px}
.flabel{
  display:block;font-size:11px;font-weight:700;
  color:var(--sub);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;
}
.finput,.fselect{
  width:100%;
  background:var(--s2);border:1.5px solid var(--rim);
  border-radius:var(--r3);padding:11px 13px;
  color:var(--text);font-size:14px;
  font-family:inherit;outline:none;
  transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.finput:focus,.fselect:focus{border-color:var(--gold)}
.finput::placeholder{color:var(--dim)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:13px;border-radius:var(--r3);
  font-weight:700;font-size:14px;font-family:inherit;
  cursor:pointer;border:none;transition:all .15s;
  margin-top:4px;
}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#111}
.btn-gold:active{opacity:.85;transform:scale(.98)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--s2);color:var(--text);border:1.5px solid var(--rim)}
.btn-ghost:active{background:var(--s3)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-row .btn{margin-top:0}

/* Toggle pills */
.pills{display:flex;gap:0;background:var(--s2);border:1px solid var(--rim);border-radius:var(--r3);padding:3px;margin-bottom:14px}
.pill{
  flex:1;padding:8px;border-radius:calc(var(--r3) - 2px);
  border:none;background:none;color:var(--sub);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;
}
.pill.on{background:var(--s1);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ═══════════════════════════════════════
   AI CHAT
═══════════════════════════════════════ */
.chat-area{
  flex:1;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.chat-area::-webkit-scrollbar{display:none}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{
  background:var(--s2);border:1px solid var(--rim);
  border-radius:99px;padding:7px 13px;
  font-size:11px;font-weight:600;color:var(--sub);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.chip:active{background:var(--s3);color:var(--text)}
.bubble{max-width:86%}
.bubble.me{align-self:flex-end}
.bubble.bot{align-self:flex-start}
.bubble-who{font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:700}
.bubble-body{
  padding:10px 13px;border-radius:14px;
  font-size:13px;line-height:1.55;
}
.bubble.bot .bubble-body{background:var(--s2);border:1px solid var(--rim);border-bottom-left-radius:4px}
.bubble.me .bubble-body{background:linear-gradient(135deg,var(--gold),var(--gold-dk));color:#111;font-weight:600;border-bottom-right-radius:4px}
.typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.chat-bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:10px 14px calc(10px + var(--safe-b));
  background:var(--s1);border-top:1px solid var(--rim);
}
.chat-inp{
  flex:1;background:var(--s2);
  border:1.5px solid var(--rim);border-radius:99px;
  padding:10px 16px;color:var(--text);font-size:14px;
  font-family:inherit;outline:none;
  transition:border-color .15s;
}
.chat-inp:focus{border-color:var(--gold)}
.chat-inp::placeholder{color:var(--dim)}
.chat-send{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold-dk));
  color:#111;font-size:18px;font-weight:800;
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.chat-send:disabled{opacity:.35;cursor:not-allowed}
.chat-send:active{transform:scale(.92)}

/* ═══════════════════════════════════════
   LOADING / EMPTY / ERROR STATES
═══════════════════════════════════════ */
.state-box{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;
  padding:52px 24px;text-align:center;
  flex:1;
}
.state-icon{font-size:44px;line-height:1}
.state-title{font-weight:700;font-size:16px}
.state-desc{font-size:13px;color:var(--sub);line-height:1.6;max-width:260px}
.spin{
  width:30px;height:30px;
  border:3px solid var(--rim);border-top-color:var(--gold);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
.toast{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  left:50%;transform:translateX(-50%) translateY(4px);
  padding:9px 18px;border-radius:99px;
  font-size:13px;font-weight:700;
  white-space:nowrap;z-index:999;
  opacity:0;transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}

/* ═══════════════════════════════════════
   NOT IN TELEGRAM
═══════════════════════════════════════ */
.no-tg{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;padding:32px;text-align:center;gap:16px;
}
.no-tg-icon{font-size:56px}
.no-tg h2{font-size:20px;font-weight:800;color:var(--gold)}
.no-tg p{font-size:14px;color:var(--sub);line-height:1.7;max-width:300px}
.no-tg a{
  display:inline-block;margin-top:8px;
  background:linear-gradient(135deg,var(--gold),var(--gold-dk));
  color:#111;font-weight:700;font-size:14px;
  padding:12px 24px;border-radius:var(--r3);
  text-decoration:none;
}

/* ═══════════════════════════════════════
   RESPONSIVE TWEAKS
═══════════════════════════════════════ */
@media(max-width:360px){
  .sv{font-size:16px}
  .nav-tab{font-size:8px}
  .nav-tab .ni{font-size:20px}
}
@media(min-width:600px){
  #app{max-width:480px;margin:0 auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════
   TELEGRAM INIT
═══════════════════════════════════════════ */
const tg      = window.Telegram?.WebApp;
const TG_USER = tg?.initDataUnsafe?.user || null;
const TG_ID   = TG_USER?.id ? String(TG_USER.id) : null;

if (tg) {
  tg.ready();
  tg.expand();
  tg.enableClosingConfirmation?.();
  if (tg.setHeaderColor)    tg.setHeaderColor('#131929');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#0d1220');
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const API = window.location.origin;

const fmt = n => '₦' + Number(n || 0).toLocaleString('en-NG');
const pct = (a, b) => b > 0 ? ((a / b) * 100).toFixed(1) + '%' : '—';
const el  = id => document.getElementById(id);
const mk  = (tag, cls) => Object.assign(document.createElement(tag), { className: cls || '' });
const txt = (t) => document.createTextNode(t);

let toastTimer;
function toast(msg, type = 'ok') {
  const t = el('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

async function api(path, opts = {}) {
  if (!TG_ID) throw new Error('Not in Telegram');
  const r = await fetch(API + '/mini' + path, {
    headers: { 'Content-Type': 'application/json', 'x-tg-id': TG_ID },
    ...opts,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let S = {
  tab:      'dash',
  data:     null,
  loading:  true,
  err:      null,
  invView:  'list',    // 'list' | 'add'
  chat:     [{ role: 'bot', text: 'Hi! Ask me anything about your business.' }],
  chatBusy: false,
};

/* ═══════════════════════════════════════════
   RENDER ENGINE
═══════════════════════════════════════════ */
function setContent(screenId, node) {
  const scr = el(screenId);
  if (!scr) return;
  scr.innerHTML = '';
  if (node) scr.appendChild(node);
}

// ── Dashboard ──────────────────────────────
function renderDash() {
  const wrap = mk('div');

  if (S.loading) {
    const b = mk('div', 'state-box');
    b.innerHTML = '<div class="spin"></div><div class="state-desc">Loading your dashboard…</div>';
    wrap.appendChild(b);
    setContent('s-dash', wrap);
    return;
  }

  if (S.err || !S.data) {
    const b = mk('div', 'state-box');
    b.innerHTML = `<div class="state-icon">⚠️</div><div class="state-title">Could not load</div><div class="state-desc">${S.err || 'No data yet. Add products and record sales to see your dashboard.'}</div>`;
    const btn = mk('button', 'btn btn-gold'); btn.style.maxWidth = '180px';
    btn.textContent = 'Retry';
    btn.onclick = () => loadData();
    b.appendChild(btn);
    wrap.appendChild(b);
    setContent('s-dash', wrap);
    return;
  }

  const d     = S.data.dashboard;
  const prods = S.data.topProducts || [];
  const sc    = mk('div', 'scroll');

  // ── Today card
  const todayCard = mk('div', 'card');
  todayCard.innerHTML = `<div class="card-title">Today</div>`;
  const tb = mk('div', 'card-body');
  const tg2 = mk('div', 'grid2');
  tg2.innerHTML = `
    <div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.today.revenue)}</div><div class="ss">${d.today.count} sale(s)</div></div>
    <div class="sbox"><div class="sl">Profit</div><div class="sv ${d.today.profit >= 0 ? 'cgr' : 'cr'}">${fmt(d.today.profit)}</div><div class="ss">gross</div></div>
  `;
  tb.appendChild(tg2); todayCard.appendChild(tb);

  // ── Month card
  const monCard = mk('div', 'card');
  monCard.innerHTML = `<div class="card-title">This Month</div>`;
  const mb = mk('div', 'card-body');
  const mg = mk('div', 'grid4');
  mg.innerHTML = `
    <div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.month.revenue)}</div><div class="ss">${d.month.count} sales</div></div>
    <div class="sbox"><div class="sl">Net Profit</div><div class="sv ${d.netProfit >= 0 ? 'cgr' : 'cr'}">${fmt(d.netProfit)}</div><div class="ss">after expenses</div></div>
    <div class="sbox"><div class="sl">Expenses</div><div class="sv cr">${fmt(d.expenses.total)}</div><div class="ss">${d.expenses.count} entries</div></div>
    <div class="sbox"><div class="sl">Stock Value</div><div class="sv">${fmt(d.stockValue)}</div><div class="ss">${d.products.count} products</div></div>
  `;
  mb.appendChild(mg); monCard.appendChild(mb);

  // ── Chart
  let chartCard = null;
  if (prods.length > 0) {
    chartCard = mk('div', 'card');
    chartCard.innerHTML = `<div class="card-title">Top Products</div>`;
    const cb = mk('div', 'card-body');
    const chart = mk('div', 'bchart');
    const max = Math.max(...prods.map(p => p.total_revenue));
    prods.forEach(p => {
      const h = max > 0 ? Math.max(8, Math.round((p.total_revenue / max) * 84)) : 8;
      const col = mk('div', 'bcol');
      const bar = mk('div', 'bfill'); bar.style.height = h + 'px';
      const lbl = mk('div', 'blabel');
      lbl.textContent = p.product_name.length > 9 ? p.product_name.slice(0, 8) + '…' : p.product_name;
      col.appendChild(bar); col.appendChild(lbl);
      chart.appendChild(col);
    });
    cb.appendChild(chart); chartCard.appendChild(cb);
  }

  // ── Alerts
  const alerts = mk('div');
  if (d.lowStock > 0) {
    const a = mk('div', 'alert warn');
    a.innerHTML = `<div class="alert-ico">⚠️</div><div><div class="alert-title">${d.lowStock} item(s) low on stock</div><div class="alert-desc">Go to Inventory to restock</div></div>`;
    alerts.appendChild(a);
  }
  if (d.netProfit < 0 && d.month.revenue > 0) {
    const a = mk('div', 'alert danger');
    a.innerHTML = `<div class="alert-ico">📉</div><div><div class="alert-title">Expenses exceed profit</div><div class="alert-desc">Net loss: ${fmt(Math.abs(d.netProfit))} this month</div></div>`;
    alerts.appendChild(a);
  }
  if (d.pendingOrders > 0) {
    const a = mk('div', 'alert info');
    a.innerHTML = `<div class="alert-ico">🚚</div><div><div class="alert-title">${d.pendingOrders} pending order(s)</div><div class="alert-desc">Check orders in your Telegram bot</div></div>`;
    alerts.appendChild(a);
  }

  sc.appendChild(todayCard);
  sc.appendChild(monCard);
  if (chartCard) sc.appendChild(chartCard);
  if (alerts.children.length) sc.appendChild(alerts);

  wrap.appendChild(sc);
  setContent('s-dash', wrap);
}

// ── Sales ──────────────────────────────────
function renderSales() {
  const wrap = mk('div');
  const sc   = mk('div', 'scroll');
  const prods = S.data?.inventoryList || [];
  const recent = S.data?.recentSales || [];

  // Form
  const card = mk('div', 'card');
  card.innerHTML = `<div class="card-title">Record a Sale</div>`;
  const body = mk('div', 'card-body');

  // Product field
  const fg1 = mk('div', 'fgroup');
  const lbl1 = mk('label', 'flabel'); lbl1.textContent = 'Product';
  fg1.appendChild(lbl1);
  let prodEl;
  if (prods.length) {
    prodEl = mk('select', 'fselect'); prodEl.id = 's-prod';
    const opt0 = mk('option'); opt0.value = ''; opt0.textContent = '— Select product —';
    prodEl.appendChild(opt0);
    prods.forEach(p => {
      const o = mk('option'); o.value = p.name; o.textContent = `${p.name} (${p.stock} ${p.unit})`;
      prodEl.appendChild(o);
    });
  } else {
    prodEl = mk('input', 'finput'); prodEl.id = 's-prod';
    prodEl.placeholder = 'Product name';
  }
  fg1.appendChild(prodEl);

  // Row: qty + price
  const f2 = mk('div', 'f2');
  const fg2 = mk('div', 'fgroup');
  fg2.innerHTML = `<label class="flabel">Quantity</label><input class="finput" id="s-qty" type="number" placeholder="1" min="0.01" step="any"/>`;
  const fg3 = mk('div', 'fgroup');
  fg3.innerHTML = `<label class="flabel">Price (₦)</label><input class="finput" id="s-price" type="number" placeholder="2500"/>`;
  f2.appendChild(fg2); f2.appendChild(fg3);

  const fg4 = mk('div', 'fgroup');
  fg4.innerHTML = `<label class="flabel">Customer (optional)</label><input class="finput" id="s-cust" placeholder="Name or phone"/>`;

  const btn = mk('button', 'btn btn-gold');
  btn.id = 'sale-btn'; btn.textContent = '💰 Record Sale';
  btn.onclick = async () => {
    const pname = el('s-prod')?.value?.trim();
    const qty   = parseFloat(el('s-qty')?.value);
    const price = parseFloat(el('s-price')?.value);
    const cust  = el('s-cust')?.value?.trim() || null;
    if (!pname) return toast('Select or enter a product', 'err');
    if (!qty || qty <= 0) return toast('Enter a valid quantity', 'err');
    if (!price || price <= 0) return toast('Enter a valid price', 'err');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await api('/sale', { method: 'POST', body: JSON.stringify({ product_name: pname, quantity: qty, sell_price: price, customer: cust }) });
      if (el('s-prod').tagName === 'SELECT') el('s-prod').value = '';
      else el('s-prod').value = '';
      el('s-qty').value = ''; el('s-price').value = ''; el('s-cust').value = '';
      toast('✅ Sale recorded!');
      tg?.HapticFeedback?.notificationOccurred('success');
      await loadData();
    } catch(e) { toast(e.message, 'err'); }
    btn.disabled = false; btn.textContent = '💰 Record Sale';
  };

  body.appendChild(fg1); body.appendChild(f2); body.appendChild(fg4); body.appendChild(btn);
  card.appendChild(body); sc.appendChild(card);

  // Recent
  if (recent.length) {
    const rc = mk('div', 'card');
    rc.innerHTML = `<div class="card-title">Recent Sales</div>`;
    const rb = mk('div', 'card-body rlist');
    recent.slice(0, 8).forEach(s => {
      const row = mk('div', 'rrow');
      row.innerHTML = `
        <div class="rrow-l">
          <div class="rrow-name">${s.product_name}</div>
          <div class="rrow-sub">×${s.quantity}${s.customer ? ' · ' + s.customer : ''}</div>
        </div>
        <div class="rrow-r">
          <div class="rrow-val cg">${fmt(s.revenue)}</div>
          <div style="font-size:10px;color:var(--sub)">profit ${fmt(s.profit)}</div>
        </div>`;
      rb.appendChild(row);
    });
    rc.appendChild(rb); sc.appendChild(rc);
  }

  wrap.appendChild(sc);
  setContent('s-sales', wrap);
}

// ── Inventory ──────────────────────────────
function renderInv() {
  const wrap = mk('div');
  const sc   = mk('div', 'scroll');

  // Pills
  const pills = mk('div', 'pills');
  ['📦 Products', '➕ Add Product'].forEach((lbl, i) => {
    const p = mk('button', 'pill' + (i === (S.invView === 'list' ? 0 : 1) ? ' on' : ''));
    p.textContent = lbl;
    p.onclick = () => { S.invView = i === 0 ? 'list' : 'add'; renderInv(); };
    pills.appendChild(p);
  });
  sc.appendChild(pills);

  if (S.invView === 'list') {
    const low  = S.data?.lowStockItems || [];
    const all  = S.data?.inventoryList || [];

    if (low.length) {
      const lc = mk('div', 'card');
      lc.innerHTML = `<div class="card-title">⚠️ Low Stock (${low.length})</div>`;
      const lb = mk('div', 'card-body rlist');
      low.forEach(p => {
        const row = mk('div', 'rrow');
        row.innerHTML = `
          <div class="rrow-l"><div class="rrow-name">${p.name}</div><div class="rrow-sub">Min: ${p.min_stock} ${p.unit}</div></div>
          <div class="rrow-r"><span class="badge bg-red">${p.stock} left</span></div>`;
        lb.appendChild(row);
      });
      lc.appendChild(lb); sc.appendChild(lc);
    }

    const ac = mk('div', 'card');
    ac.innerHTML = `<div class="card-title">All Products (${all.length})</div>`;
    if (!all.length) {
      const empty = mk('div', 'card-body');
      empty.innerHTML = `<div class="state-box" style="padding:28px 0"><div class="state-icon">📦</div><div class="state-desc">No products yet.<br>Tap "Add Product" to start.</div></div>`;
      ac.appendChild(empty);
    } else {
      const ab = mk('div', 'card-body rlist');
      all.forEach(p => {
        const row = mk('div', 'rrow');
        row.innerHTML = `
          <div class="rrow-l">
            <div class="rrow-name">${p.name}</div>
            <div class="rrow-sub">Cost ${fmt(p.cost_price)} · Sell ${fmt(p.sell_price)}</div>
          </div>
          <div class="rrow-r">
            <span class="badge ${p.stock <= p.min_stock ? 'bg-red' : 'bg-green'}">${p.stock} ${p.unit}</span>
          </div>`;
        ab.appendChild(row);
      });
      ac.appendChild(ab);
    }
    sc.appendChild(ac);

  } else {
    // Add product form
    const fc = mk('div', 'card');
    fc.innerHTML = `<div class="card-title">Add New Product</div>`;
    const fb = mk('div', 'card-body');
    fb.innerHTML = `
      <div class="fgroup"><label class="flabel">Product Name</label><input class="finput" id="p-name" placeholder="e.g. Coca-Cola 50cl"/></div>
      <div class="f2">
        <div class="fgroup"><label class="flabel">Sell Price (₦)</label><input class="finput" id="p-sell" type="number" placeholder="500"/></div>
        <div class="fgroup"><label class="flabel">Cost Price (₦)</label><input class="finput" id="p-cost" type="number" placeholder="300"/></div>
      </div>
      <div class="f2">
        <div class="fgroup"><label class="flabel">Opening Stock</label><input class="finput" id="p-stock" type="number" placeholder="50"/></div>
        <div class="fgroup"><label class="flabel">Unit</label><input class="finput" id="p-unit" placeholder="pieces" value="unit"/></div>
      </div>
    `;
    const btn = mk('button', 'btn btn-gold');
    btn.textContent = '📦 Add Product';
    btn.onclick = async () => {
      const name  = el('p-name')?.value?.trim();
      const sell  = parseFloat(el('p-sell')?.value);
      const cost  = parseFloat(el('p-cost')?.value || 0);
      const stock = parseFloat(el('p-stock')?.value || 0);
      const unit  = el('p-unit')?.value?.trim() || 'unit';
      if (!name)             return toast('Enter product name', 'err');
      if (!sell || sell <= 0) return toast('Enter a valid sell price', 'err');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await api('/product', { method: 'POST', body: JSON.stringify({ name, sell_price: sell, cost_price: cost, stock, unit }) });
        toast('✅ Product added!');
        S.invView = 'list';
        await loadData();
      } catch(e) { toast(e.message, 'err'); }
      btn.disabled = false; btn.textContent = '📦 Add Product';
    };
    fb.appendChild(btn); fc.appendChild(fb); sc.appendChild(fc);
  }

  wrap.appendChild(sc);
  setContent('s-inv', wrap);
}

// ── Expenses ───────────────────────────────
function renderExp() {
  const wrap = mk('div');
  const sc   = mk('div', 'scroll');
  const cats  = ['General','Utilities','Transport','Stock/Supply','Operations','Marketing','Payroll','Other'];
  const recExp = S.data?.recentExpenses || [];
  const expCat = S.data?.expenseBreakdown || [];

  // Form
  const fc = mk('div', 'card');
  fc.innerHTML = `<div class="card-title">Record Expense</div>`;
  const fb = mk('div', 'card-body');
  fb.innerHTML = `
    <div class="fgroup"><label class="flabel">Description</label><input class="finput" id="e-desc" placeholder="e.g. Generator fuel, transport"/></div>
    <div class="f2">
      <div class="fgroup"><label class="flabel">Amount (₦)</label><input class="finput" id="e-amt" type="number" placeholder="5000"/></div>
      <div class="fgroup"><label class="flabel">Category</label>
        <select class="fselect" id="e-cat">${cats.map(c => `<option>${c}</option>`).join('')}</select>
      </div>
    </div>
  `;
  const btn = mk('button', 'btn btn-gold'); btn.textContent = '💸 Record Expense';
  btn.onclick = async () => {
    const desc = el('e-desc')?.value?.trim();
    const amt  = parseFloat(el('e-amt')?.value);
    const cat  = el('e-cat')?.value;
    if (!desc) return toast('Enter a description', 'err');
    if (!amt || amt <= 0) return toast('Enter a valid amount', 'err');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await api('/expense', { method: 'POST', body: JSON.stringify({ description: desc, amount: amt, category: cat }) });
      el('e-desc').value = ''; el('e-amt').value = '';
      toast('✅ Expense recorded!');
      await loadData();
    } catch(e) { toast(e.message, 'err'); }
    btn.disabled = false; btn.textContent = '💸 Record Expense';
  };
  fb.appendChild(btn); fc.appendChild(fb); sc.appendChild(fc);

  // By category
  if (expCat.length) {
    const cc = mk('div', 'card');
    cc.innerHTML = `<div class="card-title">This Month by Category</div>`;
    const cb = mk('div', 'card-body rlist');
    expCat.forEach(c => {
      const row = mk('div', 'rrow');
      row.innerHTML = `<div class="rrow-l"><div class="rrow-name">${c.category}</div></div><div class="rrow-r"><div class="rrow-val cr">${fmt(c.total)}</div></div>`;
      cb.appendChild(row);
    });
    cc.appendChild(cb); sc.appendChild(cc);
  }

  // Recent
  if (recExp.length) {
    const rc = mk('div', 'card');
    rc.innerHTML = `<div class="card-title">Recent Expenses</div>`;
    const rb = mk('div', 'card-body rlist');
    recExp.slice(0, 8).forEach(e => {
      const row = mk('div', 'rrow');
      row.innerHTML = `
        <div class="rrow-l"><div class="rrow-name">${e.description}</div><div class="rrow-sub">${e.category}</div></div>
        <div class="rrow-r"><div class="rrow-val cr">${fmt(e.amount)}</div></div>`;
      rb.appendChild(row);
    });
    rc.appendChild(rb); sc.appendChild(rc);
  }

  wrap.appendChild(sc);
  setContent('s-exp', wrap);
}

// ── AI Chat ────────────────────────────────
function renderChat() {
  const scr = el('s-ai');
  if (!scr) return;
  scr.innerHTML = '';
  scr.style.display = 'flex';
  scr.style.flexDirection = 'column';
  scr.style.overflow = 'hidden';

  // Quick chips
  const chips = mk('div', 'chips-row');
  ['How much did I make today?', 'What stock is low?', "This month's profit?", 'Give me advice'].forEach(q => {
    const c = mk('div', 'chip'); c.textContent = q;
    c.onclick = () => sendChat(q);
    chips.appendChild(c);
  });

  // Messages area
  const area = mk('div', 'chat-area'); area.id = 'chat-area';

  // Chat bar
  const bar = mk('div', 'chat-bar');
  const inp = mk('input', 'chat-inp'); inp.id = 'chat-inp';
  inp.placeholder = 'Ask about your business…';
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } };
  const send = mk('button', 'chat-send'); send.id = 'chat-send';
  send.innerHTML = '↑'; send.onclick = () => sendChat();
  bar.appendChild(inp); bar.appendChild(send);

  scr.appendChild(chips); scr.appendChild(area); scr.appendChild(bar);
  renderMessages();
}

function renderMessages() {
  const area = el('chat-area');
  if (!area) return;
  area.innerHTML = '';

  S.chat.forEach(m => {
    const bub = mk('div', `bubble ${m.role === 'bot' ? 'bot' : 'me'}`);
    const who = mk('div', 'bubble-who'); who.textContent = m.role === 'bot' ? '🤖 ShopBoss' : '👤 You';
    const body = mk('div', 'bubble-body');
    body.innerHTML = m.text.replace(/\n/g, '<br/>');
    bub.appendChild(who); bub.appendChild(body);
    area.appendChild(bub);
  });

  if (S.chatBusy) {
    const bub = mk('div', 'bubble bot');
    const who = mk('div', 'bubble-who'); who.textContent = '🤖 ShopBoss';
    const body = mk('div', 'bubble-body typing');
    body.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    bub.appendChild(who); bub.appendChild(body);
    area.appendChild(bub);
  }

  area.scrollTop = area.scrollHeight;
}

async function sendChat(preset) {
  const inp  = el('chat-inp');
  const text = preset || inp?.value?.trim();
  if (!text || S.chatBusy) return;
  if (inp && !preset) inp.value = '';
  S.chat.push({ role: 'user', text });
  S.chatBusy = true;
  renderMessages();
  try {
    const res = await api('/ask', { method: 'POST', body: JSON.stringify({ question: text }) });
    S.chat.push({ role: 'bot', text: res.answer });
  } catch(e) {
    S.chat.push({ role: 'bot', text: '⚠️ ' + e.message });
  }
  S.chatBusy = false;
  renderMessages();
}

/* ═══════════════════════════════════════════
   TAB SWITCHING
═══════════════════════════════════════════ */
const TABS = ['dash','sales','inv','exp','ai'];

function switchTab(id) {
  S.tab = id;
  TABS.forEach(t => {
    const scr = el('s-' + t);
    const btn = el('t-' + t);
    if (scr) scr.classList.toggle('active', t === id);
    if (btn) btn.classList.toggle('active', t === id);
  });
  renderTab(id);
}

function renderTab(id) {
  if (id === 'dash')  renderDash();
  if (id === 'sales') renderSales();
  if (id === 'inv')   renderInv();
  if (id === 'exp')   renderExp();
  if (id === 'ai')    renderChat();
}

/* ═══════════════════════════════════════════
   DATA LOADING
═══════════════════════════════════════════ */
async function loadData() {
  try {
    const res = await api('/data');
    S.data = res; S.loading = false; S.err = null;
    const bn = el('biz-name');
    if (bn && res.businessName) bn.textContent = res.businessName;
  } catch(e) {
    S.loading = false;
    S.err = e.message;
  }
  renderTab(S.tab);
}

   BOOT

function boot() {

  if (!TG_ID) {
    app.innerHTML = `
      <div class="no-tg">
        <div class="no-tg-icon">📱</div>
        <h2>Open inside Telegram</h2>
        <p>ShopBoss must be launched from inside the Telegram app. Open your ShopBoss bot and send /app to launch this dashboard.</p>
        <a href="https://t.me/AiBizRepoBot">Open ShopBoss Bot →</a>
      </div>`;
    return;
  }

  const bizName = TG_USER?.first_name ? `${TG_USER.first_name}'s Business` : 'My Business';

  app.innerHTML = `
    <div class="hdr">
      <div class="hdr-brand">
        <div class="hdr-logo">🏪</div>
        <div>
          <div class="hdr-name">ShopBoss</div>
          <div class="hdr-biz" id="biz-name">${bizName}</div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="hdr-badge">LIVE</div>

    <div class="content">

    <nav class="nav">
      <button class="nav-tab active" id="t-dash" onclick="switchTab('dash')">

boot();
