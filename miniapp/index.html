<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070B12"/>
<title>ShopBoss</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & TOKENS ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070B12; --c30:#0F1923; --c30b:#141F2E; --c30c:#1A2840;
  --rim:#1E3050; --wire:#243D5A; --dim:#3A5070;
  --gold:#E8A020; --gold3:#C07818; --gold-pale:rgba(232,160,32,.1);
  --green:#0FB981; --red:#F04060; --blue:#4890F8;
  --text:#EDF0F7; --sub:#7A90AA;
  --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  --nav:58px; --hdr:56px; --r:14px; --r2:10px; --r3:7px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}

/* ── APP SHELL ───────────────────────────────────────────── */
#root{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* ── HEADER ──────────────────────────────────────────────── */
.hdr{flex-shrink:0;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--c30);border-bottom:1px solid var(--rim);padding-top:env(safe-area-inset-top,0)}
.hdr-back{width:34px;height:34px;border-radius:9px;background:var(--c30b);border:1px solid var(--rim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;border:none;color:var(--text)}
.hdr-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold3),var(--gold));display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;color:#0A0800;font-size:16px;flex-shrink:0}
.hdr-title{font-family:var(--disp);font-size:16px;font-weight:800;color:var(--gold);flex:1;letter-spacing:-.2px}
.hdr-sub{font-size:11px;color:var(--sub)}
.hdr-badge{background:rgba(15,185,129,.15);color:var(--green);border:1px solid rgba(15,185,129,.3);font-family:var(--disp);font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0}

/* ── SCREENS ─────────────────────────────────────────────── */
.content{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .3s ease,opacity .25s ease;will-change:transform}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.slide-left{transform:translateX(-30%);opacity:0;pointer-events:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:16px 16px calc(20px + var(--safe-b))}

/* ── BOTTOM NAV ──────────────────────────────────────────── */
.nav{flex-shrink:0;display:grid;background:var(--c30);border-top:1px solid var(--rim);padding-bottom:var(--safe-b)}
.nav.tabs-5{grid-template-columns:repeat(5,1fr)}
.nav.tabs-4{grid-template-columns:repeat(4,1fr)}
.ntab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 2px;border:none;background:none;color:var(--dim);font-family:var(--disp);font-size:8.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;cursor:pointer;transition:color .15s;min-height:var(--nav)}
.ntab .ni{font-size:20px;line-height:1;transition:transform .18s}
.ntab.on{color:var(--gold)}.ntab.on .ni{transform:scale(1.18)}

/* ── ONBOARDING PROGRESS SPINE ───────────────────────────── */
.ob-wrap{display:flex;min-height:100%;overflow:hidden}
.ob-spine{width:4px;flex-shrink:0;background:var(--rim);position:relative;margin:24px 0 24px 20px}
.ob-spine-fill{position:absolute;top:0;left:0;right:0;background:linear-gradient(180deg,var(--gold),var(--gold3));border-radius:99px;transition:height .6s ease}
.ob-spine-dot{position:absolute;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;border:2px solid var(--rim);background:var(--bg);transition:all .3s}
.ob-spine-dot.done{background:var(--gold);border-color:var(--gold)}
.ob-spine-dot.active{background:var(--bg);border-color:var(--gold);box-shadow:0 0 0 4px rgba(232,160,32,.2)}
.ob-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 16px 20px}
.ob-body::-webkit-scrollbar{display:none}

/* ── CARDS ───────────────────────────────────────────────── */
.card{background:var(--c30);border:1px solid var(--rim);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.card-title{padding:12px 14px 0;font-family:var(--disp);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--sub)}
.card-body{padding:12px 14px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{background:var(--c30b);border:1px solid var(--rim);border-radius:10px;padding:13px 11px}
.sl{font-family:var(--disp);font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.sv{font-family:var(--disp);font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.5px;line-height:1}
.ss{font-size:10px;color:var(--sub);margin-top:3px}
.cg{color:var(--gold)}.cgr{color:var(--green)}.cr{color:var(--red)}

/* Alert */
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:10px;margin-bottom:8px;border:1px solid}
.alert.warn{background:rgba(232,160,32,.07);border-color:rgba(232,160,32,.22)}
.alert.danger{background:rgba(240,64,96,.07);border-color:rgba(240,64,96,.22)}
.alert-ico{font-size:17px;flex-shrink:0;line-height:1.3}
.alert-ttl{font-family:var(--disp);font-weight:700;font-size:13px}
.alert-dsc{font-size:11px;color:var(--sub);margin-top:2px}

/* Bar chart */
.bchart{display:flex;align-items:flex-end;gap:5px;height:76px;padding-top:4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bfill{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--gold),var(--gold3));min-height:4px}
.blbl{font-family:var(--disp);font-size:9px;color:var(--sub);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}

/* Rows */
.rlist .rr{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--rim)}
.rlist .rr:last-child{border-bottom:none;padding-bottom:0}
.rlist .rr:first-child{padding-top:0}
.rr-l{flex:1;min-width:0}
.rr-name{font-family:var(--disp);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-sub{font-size:11px;color:var(--sub);margin-top:1px}
.rr-r{text-align:right;flex-shrink:0;margin-left:10px}
.rr-val{font-family:var(--disp);font-weight:700;font-size:13px}

/* Badge */
.badge{font-family:var(--disp);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.bg-green{background:rgba(15,185,129,.15);color:var(--green)}
.bg-red{background:rgba(240,64,96,.15);color:var(--red)}
.bg-gold{background:rgba(232,160,32,.15);color:var(--gold)}

/* ── FORMS ───────────────────────────────────────────────── */
.fg{margin-bottom:12px}
.fl{display:block;font-family:var(--disp);font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.fi,.fsel,.fta{width:100%;background:var(--c30b);border:1.5px solid var(--rim);border-radius:9px;padding:12px 13px;color:var(--text);font-size:16px;font-family:var(--body);outline:none;transition:border-color .15s;-webkit-appearance:none}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--gold)}
.fi::placeholder,.fta::placeholder{color:var(--dim)}
.fta{resize:none;min-height:80px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ferr{font-size:12px;color:var(--red);margin-top:4px;display:none}
.ferr.show{display:block}

/* OTP input row */
.otp-row{display:flex;gap:8px;justify-content:center;margin:20px 0}
.otp-digit{width:46px;height:56px;border-radius:10px;background:var(--c30b);border:2px solid var(--rim);color:var(--text);font-family:var(--disp);font-size:22px;font-weight:800;text-align:center;outline:none;transition:border-color .15s;-webkit-appearance:none}
.otp-digit:focus{border-color:var(--gold)}
.otp-digit.filled{border-color:rgba(232,160,32,.5)}

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border-radius:9px;font-family:var(--disp);font-weight:700;font-size:14px;cursor:pointer;border:none;transition:all .15s;letter-spacing:.2px}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;position:relative}
.btn-gold:active{opacity:.85;transform:scale(.98)}
.btn-gold:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--c30b);color:var(--text);border:1.5px solid var(--rim)}
.btn-ghost:active{background:var(--c30c)}
.btn-danger{background:rgba(240,64,96,.12);color:var(--red);border:1px solid rgba(240,64,96,.3)}
.mt8{margin-top:8px}
.btn-sm{padding:9px 16px;font-size:12px;width:auto;border-radius:7px}

/* Pulse ring on primary CTA */
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(232,160,32,.5)}70%{box-shadow:0 0 0 14px rgba(232,160,32,0)}100%{box-shadow:0 0 0 0 rgba(232,160,32,0)}}
.btn-gold.pulse{animation:pulse-ring 2s ease infinite}

/* Pills */
.pills{display:flex;gap:0;background:var(--c30b);border:1px solid var(--rim);border-radius:9px;padding:3px;margin-bottom:12px}
.pill-btn{flex:1;padding:8px;border-radius:7px;border:none;background:none;color:var(--sub);font-family:var(--disp);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.pill-btn.on{background:var(--c30);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ── MARKETPLACE ─────────────────────────────────────────── */
.filter-scroll{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 0;-webkit-overflow-scrolling:touch}
.filter-scroll::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;padding:7px 14px;border-radius:99px;border:1.5px solid var(--rim);background:var(--c30b);color:var(--sub);font-family:var(--disp);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.fchip.on{border-color:var(--gold);background:var(--gold-pale);color:var(--gold)}
.vendor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.vendor-card{background:var(--c30);border:1px solid var(--rim);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .18s}
.vendor-card:active{border-color:var(--gold)}
.vc-top{padding:12px 12px 8px;display:flex;align-items:flex-start;gap:8px}
.vc-av{width:38px;height:38px;border-radius:9px;background:var(--c30b);border:1px solid var(--rim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.vc-info{flex:1;min-width:0}
.vc-name{font-family:var(--disp);font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-ind{font-size:10px;color:var(--sub);margin-top:1px}
.vc-stars{color:var(--gold);font-size:10px;margin-top:3px;letter-spacing:.5px}
.vc-footer{padding:8px 12px;background:var(--c30b);border-top:1px solid var(--rim);font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--rim);background:var(--c30)}
.pg-info{font-family:var(--disp);font-size:12px;color:var(--sub)}
.pg-btns{display:flex;gap:8px}
.pg-btn{padding:7px 14px;border-radius:7px;border:1.5px solid var(--rim);background:var(--c30b);color:var(--sub);font-family:var(--disp);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}
.pg-btn.active{border-color:var(--gold);color:var(--gold)}

/* Vendor detail panel */
.panel{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
.panel.open{transform:translateX(0)}
.panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(14px + var(--safe-b))}
.panel-scroll::-webkit-scrollbar{display:none}
.star-input{display:flex;gap:8px;margin-bottom:12px}
.star-s{font-size:28px;cursor:pointer;opacity:.3;transition:all .12s}
.star-s.on{opacity:1;transform:scale(1.08)}
.rev-item{padding:12px 0;border-bottom:1px solid var(--rim)}
.rev-item:last-child{border-bottom:none}
.rev-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.rev-name{font-family:var(--disp);font-weight:700;font-size:12px}
.rev-stars{color:var(--gold);font-size:11px}
.rev-text{font-size:12px;color:var(--sub);line-height:1.55}

/* ── AI CHAT ─────────────────────────────────────────────── */
.chat-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chat-area::-webkit-scrollbar{display:none}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.chip{background:var(--c30b);border:1px solid var(--rim);border-radius:99px;padding:7px 12px;font-family:var(--disp);font-size:11px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.chip:active{background:var(--c30c);color:var(--text)}
.bubble{max-width:86%}
.bubble.me{align-self:flex-end}
.bubble.bot{align-self:flex-start}
.bwho{font-family:var(--disp);font-size:10px;color:var(--sub);margin-bottom:4px;font-weight:700}
.bbody{padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.55}
.bubble.bot .bbody{background:var(--c30b);border:1px solid var(--rim);border-bottom-left-radius:3px}
.bubble.me .bbody{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:600;border-bottom-right-radius:3px}
.td{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.chat-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + var(--safe-b));background:var(--c30);border-top:1px solid var(--rim)}
.chat-inp{flex:1;background:var(--c30b);border:1.5px solid var(--rim);border-radius:99px;padding:10px 15px;color:var(--text);font-size:14px;font-family:var(--body);outline:none;transition:border-color .15s}
.chat-inp:focus{border-color:var(--gold)}
.chat-inp::placeholder{color:var(--dim)}
.chat-send{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-size:17px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-send:disabled{opacity:.35;cursor:not-allowed}

/* ── STATE VIEWS ─────────────────────────────────────────── */
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:52px 28px;text-align:center;flex:1}
.state-ico{font-size:48px;line-height:1}
.state-ttl{font-family:var(--disp);font-weight:800;font-size:18px}
.state-dsc{font-size:13px;color:var(--sub);line-height:1.7;max-width:260px}
.spin{width:28px;height:28px;border:3px solid var(--rim);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(4px);padding:9px 18px;border-radius:99px;font-family:var(--disp);font-size:13px;font-weight:700;white-space:nowrap;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;bottom:calc(var(--nav) + var(--safe-b) + 10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green);color:#fff}
.toast.err{background:var(--red);color:#fff}

/* ── KYC SPECIFIC ────────────────────────────────────────── */
.kyc-hero{text-align:center;padding:28px 20px 20px}
.kyc-brand{font-family:var(--disp);font-size:28px;font-weight:800;color:var(--gold);letter-spacing:-.5px}
.kyc-tagline{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
.progress-bar{height:3px;background:var(--rim);border-radius:99px;margin:0 16px 20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:99px;transition:width .4s ease}
.step-label{font-family:var(--disp);font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;padding:0 16px;margin-bottom:6px}
.step-title{font-family:var(--disp);font-size:18px;font-weight:800;padding:0 16px;margin-bottom:4px;letter-spacing:-.2px}
.step-desc{font-size:13px;color:var(--sub);padding:0 16px;margin-bottom:18px;line-height:1.6}

/* Success animation */
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.success-ico{animation:pop .5s ease forwards;display:inline-block}

/* ── ONBOARDING STEP CARDS ───────────────────────────────── */
.ob-step{background:var(--c30);border:1px solid var(--rim);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;gap:14px}
.ob-step.done{border-color:rgba(15,185,129,.3);background:rgba(15,185,129,.04)}
.ob-step.active{border-color:var(--gold);background:var(--gold-pale)}
.ob-step.locked{opacity:.45;cursor:default}
.ob-step-ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--c30b);border:1px solid var(--rim)}
.ob-step.done .ob-step-ico{background:rgba(15,185,129,.12);border-color:rgba(15,185,129,.3)}
.ob-step.active .ob-step-ico{background:var(--gold-pale);border-color:rgba(232,160,32,.3)}
.ob-step-body{flex:1;min-width:0}
.ob-step-title{font-family:var(--disp);font-weight:700;font-size:14px}
.ob-step-desc{font-size:12px;color:var(--sub);margin-top:2px}
.ob-step-badge{font-family:var(--disp);font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;flex-shrink:0}

/* ── INDUSTRY CHIPS ──────────────────────────────────────── */
.ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ind-chip{background:var(--c30b);border:1.5px solid var(--rim);border-radius:var(--r2);padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.ind-chip:active,.ind-chip.on{border-color:var(--gold);background:var(--gold-pale)}
.ind-chip-em{font-size:22px;margin-bottom:4px}
.ind-chip-name{font-family:var(--disp);font-size:10px;font-weight:700}

/* ── NOT IN TELEGRAM ─────────────────────────────────────── */
.no-tg{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px;text-align:center;gap:14px}
.no-tg-ico{font-size:52px}
.no-tg h2{font-family:var(--disp);font-size:20px;font-weight:800;color:var(--gold)}
.no-tg p{font-size:14px;color:var(--sub);line-height:1.7;max-width:280px}
.no-tg a{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none}

@media(min-width:480px){#root{max-width:420px;margin:0 auto}}
</style>
</head>
<body>
<div id="root"><div class="state"><div class="spin"></div></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ── TELEGRAM ────────────────────────────────────────────── */
const tg      = window.Telegram?.WebApp;
const TG_USER = tg?.initDataUnsafe?.user || null;
const TG_ID   = TG_USER?.id ? String(TG_USER.id) : null;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("#0F1923"); tg.setBackgroundColor?.("#070B12"); }

let toastT;
function toast(msg, type="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = `toast show ${type}`;
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2800);
}

async function api(path, opts={}) {
  const headers = { "Content-Type":"application/json", ...opts.headers };
  if (TG_ID) headers["x-tg-id"] = TG_ID;
  const r = await fetch(API + "/mini" + path, { ...opts, headers });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
  return d;
}

/* ── ROUTER ──────────────────────────────────────────────── */
const SCREENS = {};
let currentScreen = null;
let historyStack  = [];

function screen(id, el) { SCREENS[id] = el; }
function go(id, pushHistory=true) {
  if (currentScreen) {
    const prev = SCREENS[currentScreen];
    if (prev) prev.classList.add(pushHistory ? "slide-left" : "hidden");
    if (pushHistory) historyStack.push(currentScreen);
  }
  currentScreen = id;
  const el = SCREENS[id];
  if (el) { el.classList.remove("hidden","slide-left"); }
  updateNav(id);
}
function goBack() {
  if (historyStack.length === 0) return;
  const prev = historyStack.pop();
  if (currentScreen) {
    const el = SCREENS[currentScreen];
    if (el) el.classList.add("hidden");
  }
  currentScreen = prev;
  const el = SCREENS[prev];
  if (el) el.classList.remove("hidden","slide-left");
  updateNav(prev);
}

function updateNav(id) {
  document.querySelectorAll(".ntab").forEach(b => b.classList.remove("on"));
  const map = {dash:"nt-dash",sales:"nt-sales",inv:"nt-inv",market:"nt-market",ai:"nt-ai"};
  if (map[id]) document.getElementById(map[id])?.classList.add("on");
  const showNav = ["dash","sales","inv","market","ai"].includes(id);
  const nav = document.getElementById("app-nav");
  if (nav) nav.style.display = showNav ? "" : "none";
  // Back button in header
  const hdr = document.getElementById("app-hdr");
  if (hdr) {
    const existing = hdr.querySelector(".hdr-back");
    if (existing) existing.remove();
    if (historyStack.length > 0 && !showNav) {
      const b = mk("button","hdr-back");
      b.innerHTML = "←"; b.onclick = goBack;
      hdr.insertBefore(b, hdr.firstChild);
    }
  }
}

function switchTab(id) {
  historyStack = [];
  go(id, false);
  if (id === "market" && !S.vendors.length) loadVendors();
  if (id === "ai") renderAIChat();
}

function renderDash() {
  const scroll = document.querySelector("#s-dash .scroll");
  if (!scroll) return;
  scroll.innerHTML = "";

  if (S.loading) {
    const b = mk("div","state"); b.innerHTML = '<div class="spin"></div><div class="state-dsc">Loading your dashboard…</div>';
    scroll.appendChild(b); return;
  }
  if (!S.data) {
    const b = mk("div","state");
    b.innerHTML = `<div class="state-ico">⚠️</div><div class="state-ttl">Could not load</div><div class="state-dsc">Check your connection</div>`;
    const rb = mk("button","btn btn-gold mt8"); rb.style.maxWidth="160px"; rb.textContent="Retry";
    rb.onclick = loadData; b.appendChild(rb); scroll.appendChild(b); return;
  }
  const wrap = mk("div","pad"); const d = S.data.dashboard;

  // Today card
  const tc = mk("div","card"); tc.innerHTML = '<div class="card-title">Today</div>';
  const tb = mk("div","card-body g2");
  tb.innerHTML = `
    <div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.today.revenue)}</div><div class="ss">${d.today.count} sale(s)</div></div>
    <div class="sbox"><div class="sl">Profit</div><div class="sv ${d.today.profit>=0?"cgr":"cr"}">${fmt(d.today.profit)}</div><div class="ss">gross</div></div>`;
  tc.appendChild(tb); wrap.appendChild(tc);

  // Month card
  const mc = mk("div","card"); mc.innerHTML = '<div class="card-title">This Month</div>';
  const mb = mk("div","card-body g2");
  mb.innerHTML = `
    <div class="sbox"><div class="sl">Revenue</div><div class="sv cg">${fmt(d.month.revenue)}</div><div class="ss">${d.month.count} sales</div></div>
    <div class="sbox"><div class="sl">Net Profit</div><div class="sv ${d.netProfit>=0?"cgr":"cr"}">${fmt(d.netProfit)}</div><div class="ss">after expenses</div></div>
    <div class="sbox"><div class="sl">Expenses</div><div class="sv cr">${fmt(d.expenses.total)}</div><div class="ss">${d.expenses.count} items</div></div>
    <div class="sbox"><div class="sl">Stock Value</div><div class="sv">${fmt(d.stockValue)}</div><div class="ss">${d.products.count} products</div></div>`;
  mc.appendChild(mb); wrap.appendChild(mc);

  // Top products chart
  const tops = S.data.topProducts || [];
  if (tops.length) {
    const cc = mk("div","card"); cc.innerHTML = '<div class="card-title">Top Products</div>';
    const cb = mk("div","card-body"); const chart = mk("div","bchart");
    const mx = Math.max(...tops.map(p=>p.total_revenue));
    tops.forEach(p => {
      const h = mx > 0 ? Math.max(6, Math.round((p.total_revenue/mx)*68)) : 6;
      const col = mk("div","bcol");
      const bar = mk("div","bfill"); bar.style.height = h+"px";
      const lbl = mk("div","blbl"); lbl.textContent = p.product_name.length>8?p.product_name.slice(0,7)+"…":p.product_name;
      col.appendChild(bar); col.appendChild(lbl); chart.appendChild(col);
    });
    cb.appendChild(chart); cc.appendChild(cb); wrap.appendChild(cc);
  }

  // Alerts
  if (d.lowStock > 0) {
    const a = mk("div","alert warn");
    a.innerHTML = `<div class="alert-ico">⚠️</div><div><div class="alert-ttl">${d.lowStock} item(s) low on stock</div><div class="alert-dsc">Check the Stock tab</div></div>`;
    wrap.appendChild(a);
  }
  if (d.netProfit < 0 && d.month.revenue > 0) {
    const a = mk("div","alert danger");
    a.innerHTML = `<div class="alert-ico">📉</div><div><div class="alert-ttl">Expenses exceed revenue</div><div class="alert-dsc">Net loss: ${fmt(Math.abs(d.netProfit))}</div></div>`;
    wrap.appendChild(a);
  }

  // Recent sales
  const recent = S.data.recentSales || [];
  if (recent.length) {
    const rc = mk("div","card"); rc.innerHTML = '<div class="card-title">Recent Sales</div>';
    const rb = mk("div","card-body rlist");
    recent.slice(0,5).forEach(s => {
      const row = mk("div","rr");
      row.innerHTML = `<div class="rr-l"><div class="rr-name">${s.product_name}</div><div class="rr-sub">×${s.quantity}${s.customer?" · "+s.customer:""}</div></div><div class="rr-r"><div class="rr-val cg">${fmt(s.revenue)}</div><div style="font-size:10px;color:var(--sub)">profit ${fmt(s.profit)}</div></div>`;
      rb.appendChild(row);
    });
    rc.appendChild(rb); wrap.appendChild(rc);
  }

  scroll.appendChild(wrap);
}

function renderSales() {
  const scroll = document.querySelector("#s-sales .scroll");
  if (!scroll) return;
  scroll.innerHTML = "";
  const wrap = mk("div","pad");
  const prods = S.data?.inventoryList || [];

  // Record sale form
  const fc = mk("div","card"); fc.innerHTML = '<div class="card-title">Record a Sale</div>';
  const fb = mk("div","card-body");
  const fg1 = mk("div","fg"); const l1 = mk("label","fl"); l1.textContent = "Product"; fg1.appendChild(l1);
  let pe;
  if (prods.length) {
    pe = document.createElement("select"); pe.className = "fsel"; pe.id = "sp-prod";
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "— Pick a product —"; pe.appendChild(o0);
    prods.forEach(p => { const o = document.createElement("option"); o.value = p.name; o.textContent = `${p.name} (${p.stock} ${p.unit})`; pe.appendChild(o); });
  } else {
    pe = document.createElement("input"); pe.className = "fi"; pe.id = "sp-prod"; pe.placeholder = "Product name";
  }
  fg1.appendChild(pe);
  const fr = mk("div","f2"); fr.innerHTML = `
    <div class="fg"><label class="fl">Quantity</label><input class="fi" id="sp-qty" type="number" placeholder="1" min="0.1" step="any"/></div>
    <div class="fg"><label class="fl">Price (₦)</label><input class="fi" id="sp-price" type="number" placeholder="2500"/></div>`;
  const fc4 = mk("div","fg"); fc4.innerHTML = '<label class="fl">Customer (optional)</label><input class="fi" id="sp-cust" placeholder="Name or phone"/>';
  const btn = mk("button","btn btn-gold mt8"); btn.textContent = "💰 Record Sale";
  btn.onclick = async () => {
    const pname = document.getElementById("sp-prod")?.value?.trim();
    const qty   = parseFloat(document.getElementById("sp-qty")?.value);
    const price = parseFloat(document.getElementById("sp-price")?.value);
    const cust  = document.getElementById("sp-cust")?.value?.trim() || null;
    if (!pname) return toast("Select or enter a product","err");
    if (!qty||qty<=0) return toast("Enter a valid quantity","err");
    if (!price||price<=0) return toast("Enter a valid price","err");
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      await api("/sale",{method:"POST",body:JSON.stringify({product_name:pname,quantity:qty,sell_price:price,customer:cust})});
      document.getElementById("sp-prod").value = "";
      document.getElementById("sp-qty").value = "";
      document.getElementById("sp-price").value = "";
      document.getElementById("sp-cust").value = "";
      toast("✅ Sale recorded!"); tg?.HapticFeedback?.notificationOccurred("success");
      await loadData();
    } catch(e) { toast(e.message,"err"); }
    btn.disabled = false; btn.textContent = "💰 Record Sale";
  };
  fb.appendChild(fg1); fb.appendChild(fr); fb.appendChild(fc4); fb.appendChild(btn); fc.appendChild(fb); wrap.appendChild(fc);

  // Recent sales
  const recent = S.data?.recentSales || [];
  if (recent.length) {
    const rc = mk("div","card"); rc.innerHTML = '<div class="card-title">Recent Sales</div>';
    const rb = mk("div","card-body rlist");
    recent.slice(0,8).forEach(s => {
      const row = mk("div","rr");
      row.innerHTML = `<div class="rr-l"><div class="rr-name">${s.product_name}</div><div class="rr-sub">×${s.quantity}${s.customer?" · "+s.customer:""}</div></div><div class="rr-r"><div class="rr-val cg">${fmt(s.revenue)}</div><div style="font-size:10px;color:var(--sub)">profit ${fmt(s.profit)}</div></div>`;
      rb.appendChild(row);
    });
    rc.appendChild(rb); wrap.appendChild(rc);
  }
  scroll.appendChild(wrap);
}

      all.forEach(p => {
        const row = mk("div","rr");
        row.innerHTML = `<div class="rr-l"><div class="rr-name">${p.name}</div><div class="rr-sub">Cost ${fmt(p.cost_price)} · Sell ${fmt(p.sell_price)}</div></div><div class="rr-r"><span class="badge ${p.stock<=p.min_stock?"bg-red":"bg-green"}">${p.stock} ${p.unit}</span></div>`;

      <div class="fg"><label class="fl">Product Name</label><input class="fi" id="p-name" placeholder="e.g. Indomie Chicken 70g"/></div>
      <div class="f2">
        <div class="fg"><label class="fl">Sell Price (₦)</label><input class="fi" id="p-sell" type="number" placeholder="500"/></div>
        <div class="fg"><label class="fl">Cost Price (₦)</label><input class="fi" id="p-cost" type="number" placeholder="300"/></div>
      </div>
      <div class="f2">
        <div class="fg"><label class="fl">Opening Stock</label><input class="fi" id="p-stock" type="number" placeholder="50"/></div>
        <div class="fg"><label class="fl">Unit</label><input class="fi" id="p-unit" placeholder="unit" value="unit"/></div>
      </div>`;
    const btn = mk("button","btn btn-gold mt8"); btn.textContent = "📦 Add Product";
    btn.onclick = async () => {
      const name  = document.getElementById("p-name")?.value?.trim();
      const sell  = parseFloat(document.getElementById("p-sell")?.value);
      const cost  = parseFloat(document.getElementById("p-cost")?.value||0);
      const stock = parseFloat(document.getElementById("p-stock")?.value||0);
      const unit  = document.getElementById("p-unit")?.value?.trim()||"unit";
      if (!name) return toast("Enter product name","err");
      if (!sell||sell<=0) return toast("Enter sell price","err");
      btn.disabled = true; btn.textContent = "Saving…";

async function loadVendors(filter, page) {
  if (filter !== undefined) S.vendorFilter = filter;
  if (page   !== undefined) S.vendorPage   = page;
  const grid = document.getElementById("mkt-grid");
  if (grid) grid.innerHTML = '<div class="state"><div class="spin"></div></div>';
  try {
    const q = new URLSearchParams({ page: S.vendorPage, industry: S.vendorFilter }).toString();
    const d = await api(`/marketplace?${q}`);
    S.vendors     = d.vendors || [];
    S.vendorTotal = d.total   || 0;
    S.vendorPages = d.pages   || 1;
    renderMarket();
  } catch(e) {
    if (grid) grid.innerHTML = `<div class="state"><div class="state-ico">⚠️</div><div class="state-dsc">${e.message}</div></div>`;
  }
}

function renderMarket() {
  // Filters
  const filterRow = document.getElementById("mkt-filters");
  if (filterRow) {
    const cats = ["All",...IND.slice(0,10).map(i=>i.n)];
    filterRow.innerHTML = cats.map(c =>
      `<div class="fchip${S.vendorFilter===c?" on":""}" onclick="loadVendors('${c}',1)">${c}</div>`
    ).join("");
  }

  // Grid
  const grid = document.getElementById("mkt-grid");
  if (grid) {
    if (!S.vendors.length) {
      grid.innerHTML = `<div class="state" style="grid-column:1/-1">
        <div class="state-ico">🛍️</div>
        <div class="state-ttl">No vendors yet</div>
        <div class="state-dsc">Be the first in your category. Open the bot and send /setname to go live.</div>
      </div>`;
    } else {
      grid.innerHTML = S.vendors.map(v => {
        const ind = IND.find(i=>i.n===v.industry)||{e:"🏪"};
        const isCrypto = v.industry === "Crypto & Gift Cards";
        const footer = isCrypto && v.sell_rate
          ? `💱 Buy ₦${Number(v.buy_rate||0).toLocaleString("en-NG")} · Sell ₦${Number(v.sell_rate).toLocaleString("en-NG")} per USDT`
          : `📍 ${v.location||v.industry}`;
        const ratesBadge = isCrypto && v.sell_rate
          ? `<div style="font-size:10px;color:var(--gold);font-weight:700;margin-top:2px">USDT · BTC · Gift Cards</div>`
          : "";
        return `<div class="vendor-card" onclick="openVendor(${v.id})">
          <div class="vc-top">
            <div class="vc-av">${ind.e}</div>
            <div class="vc-info">
              <div class="vc-name">${v.name}</div>
              <div class="vc-ind">${v.industry}</div>
              ${ratesBadge}
              <div class="vc-stars">${stars(v.rating||5)} ${Number(v.rating||5).toFixed(1)}</div>
            </div>
          </div>
          <div class="vc-footer">${footer}</div>
        </div>`;
      }).join("");
    }
  }

  // Pagination
  const pg = document.getElementById("mkt-pg");
  if (pg) {
    if (S.vendorPages <= 1) { pg.style.display = "none"; } else {
      pg.style.display = "flex";
      pg.innerHTML = `
        <div class="pg-info">Page ${S.vendorPage} of ${S.vendorPages} (${S.vendorTotal} vendors)</div>
        <div class="pg-btns">
          <button class="pg-btn" onclick="loadVendors(undefined,${S.vendorPage-1})" ${S.vendorPage<=1?"disabled":""}>← Prev</button>
          <button class="pg-btn active">${S.vendorPage}</button>
          <button class="pg-btn" onclick="loadVendors(undefined,${S.vendorPage+1})" ${S.vendorPage>=S.vendorPages?"disabled":""}>Next →</button>
        </div>`;
    }
  }

async function openVendor(id) {

function setStar(n) {
  S.reviewStar = n;
  document.querySelectorAll(".star-s").forEach((s,i) => s.classList.toggle("on", i < n));
}

async function submitReview(vendorId) {
  if (!S.reviewStar) return toast("Tap a star to rate first","err");
  const comment = document.getElementById("review-text")?.value?.trim();
  if (!comment || comment.length < 5) return toast("Write at least a few words","err");
  const btn = document.getElementById("review-btn");
  btn.disabled = true; btn.textContent = "Submitting…";
  try {
    const d = await api(`/vendor/${vendorId}/review`,{method:"POST",body:JSON.stringify({rating:S.reviewStar,comment})});
    S.hasReviewed = true;
    toast(d.updated?"✅ Review updated!":"✅ Review submitted!");
    tg?.HapticFeedback?.notificationOccurred("success");
    const fresh = await api(`/vendor/${vendorId}`);
    S.vendorReviews = fresh.reviews || [];
    S.activeVendor  = {...S.activeVendor, rating:fresh.vendor.rating, review_count:fresh.vendor.review_count};
    renderVendorDetail();
    await loadVendors();
  } catch(e) { toast(e.message,"err"); }
  const btn2 = document.getElementById("review-btn");
  if (btn2) { btn2.disabled = false; btn2.textContent = "⭐ "+(S.hasReviewed?"Update Review":"Submit Review"); }
}

function renderAIChat() {
  const s = document.getElementById("s-ai");
  if (!s) return;
  s.innerHTML = "";
  const chips = mk("div","chips-row");
  ["What's my profit today?","Which stock is running low?","Best selling product?","Give me business advice"].forEach(q => {
    const c = mk("div","chip"); c.textContent = q; c.onclick = () => sendChat(q); chips.appendChild(c);
  });
  const area = mk("div","chat-area"); area.id = "chat-area";
  const bar  = mk("div","chat-bar");
  const inp  = document.createElement("input"); inp.type="text"; inp.className="chat-inp"; inp.id="chat-inp";
  inp.placeholder="Ask about your business…";
  inp.onkeydown = e => { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();} };
  const send = mk("button","chat-send"); send.id="chat-send"; send.innerHTML="↑"; send.onclick=()=>sendChat();
  bar.appendChild(inp); bar.appendChild(send);
  s.appendChild(chips); s.appendChild(area); s.appendChild(bar);
  renderMessages();
}

function renderMessages() {
  const area = document.getElementById("chat-area");
  if (!area) return; area.innerHTML = "";
  S.chat.forEach(m => {
    const b = mk("div",`bubble ${m.role==="bot"?"bot":"me"}`);
    const who = mk("div","bwho"); who.textContent = m.role==="bot"?"🤖 ShopBoss AI":"👤 You";
    const body = mk("div","bbody"); body.innerHTML = m.text.replace(/\n/g,"<br/>");
    b.appendChild(who); b.appendChild(body); area.appendChild(b);
  });
  if (S.chatBusy) {
    const b = mk("div","bubble bot");
    const who = mk("div","bwho"); who.textContent = "🤖 ShopBoss AI";
    const body = mk("div","bbody"); body.innerHTML = '<span class="td"></span><span class="td"></span><span class="td"></span>';
    b.appendChild(who); b.appendChild(body); area.appendChild(b);
  }
  area.scrollTop = area.scrollHeight;
}

async function sendChat(preset) {
  const inp  = document.getElementById("chat-inp");
  const text = preset || inp?.value?.trim();
  if (!text || S.chatBusy) return;
  if (inp && !preset) inp.value = "";
  S.chat.push({role:"user",text}); S.chatBusy = true; renderMessages();
  try {
    const res = await api("/ask",{method:"POST",body:JSON.stringify({question:text})});
    S.chat.push({role:"bot",text:res.answer});
  } catch(e) { S.chat.push({role:"bot",text:"⚠️ "+e.message}); }
  S.chatBusy = false; renderMessages();
}

async function loadData() {
  try {
    const res = await api("/data");
    S.data    = res; S.loading = false;
    const biz = document.getElementById("biz-name-hdr");
    if (biz && res.businessName) biz.textContent = res.businessName;
    renderDash(); renderSales(); renderInv();
  } catch(e) {
    S.loading = false; S.data = null;
    renderDash();
  }
}

      <div style="font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:10px">You're verified!</div>
      <div style="font-size:13px;color:var(--sub);line-height:1.7;max-width:280px;margin-bottom:28px">Your account is confirmed. Now open the bot on Telegram to link your account and start managing your business.</div>
      <a id="tg-link-btn" href="https://t.me/AiBizRepoBot" target="_blank" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:800;font-size:15px;padding:14px 28px;border-radius:10px;text-decoration:none;width:100%;justify-content:center;margin-bottom:10px">
        💬 Open @AiBizRepoBot on Telegram
      </a>
      <div style="font-size:12px;color:var(--dim);margin-bottom:20px">Send /start to link your account → then come back here</div>
      ${TG_ID ? `<button class="btn btn-ghost" onclick="kycComplete()" style="max-width:300px">✅ I've opened the bot — continue →</button>` : ""}
    </div>`;
  parent.appendChild(s); SCREENS["kyc-done"] = s;
}

/* Onboarding wizard */
function buildOnboarding(parent) {
  const s = mk("div","screen hidden"); s.id = "s-onboarding";
  parent.appendChild(s); SCREENS["onboarding"] = s;
}

async function renderOnboarding() {
  const s = document.getElementById("s-onboarding");
  if (!s) return;
  let ob = {};
  try { ob = await api("/onboarding"); } catch(_) {}
  const steps = ob.steps || {};
  const pct = Object.values(steps).filter(Boolean).length / Object.keys(steps).length * 100;

  s.innerHTML = `
    <div class="hdr">
      <div class="hdr-logo">S</div>
      <div style="flex:1"><div class="hdr-title">Setup Checklist</div><div class="hdr-sub">${Math.round(pct)}% complete</div></div>
    </div>
    <div class="scroll pad">
      <div style="background:var(--rim);height:4px;border-radius:99px;margin-bottom:18px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:99px;transition:width .4s"></div>
      </div>

      ${obStepCard("✅","Account Verified","Your KYC is complete and account is active","done",steps.kyc_complete)}
      ${obStepCard("🏭","Set Your Industry","Tell us which sector you operate in","industry",steps.industry_set)}
      ${obStepCard("📦","Add Your First Product","Start tracking sales and inventory","product",steps.first_product,!steps.industry_set)}
      ${obStepCard("📍","Complete Your Profile","Add phone and location to the marketplace","profile",steps.profile_complete,!steps.first_product)}

      ${pct >= 100 ? `
        <div style="text-align:center;padding:20px 0">
          <div style="font-size:36px;margin-bottom:8px">🎉</div>
          <div style="font-family:var(--disp);font-weight:800;font-size:16px;margin-bottom:6px">All set!</div>
          <div style="font-size:13px;color:var(--sub);margin-bottom:16px">Your business is fully configured and live on the marketplace.</div>
          <button class="btn btn-gold" onclick="enterApp()" style="max-width:280px;margin:0 auto">Open Dashboard →</button>
        </div>` : `
        <button class="btn btn-ghost mt8" onclick="enterApp()">Skip — Go to Dashboard →</button>`}
    </div>`;

  // Attach step actions
  if (!steps.industry_set) {
    s.querySelector("[data-step='industry']")?.addEventListener("click", () => showIndustryPicker());
  }
  if (steps.industry_set && !steps.first_product) {
    s.querySelector("[data-step='product']")?.addEventListener("click", () => showAddProductFlow());
  }
  if (steps.first_product && !steps.profile_complete) {
    s.querySelector("[data-step='profile']")?.addEventListener("click", () => showProfileFlow(ob.vendor, ob.profile));
  }
}

function obStepCard(ico, title, desc, dataStep, done, locked=false) {
  const cls = done ? "done" : locked ? "locked" : "active";
  return `<div class="ob-step ${cls}" data-step="${dataStep}">
    <div class="ob-step-ico">${done?"✅":ico}</div>
    <div class="ob-step-body">
      <div class="ob-step-title">${title}</div>
      <div class="ob-step-desc">${desc}</div>
    </div>
    <span class="ob-step-badge badge ${done?"bg-green":locked?"bg-red":"bg-gold"}">${done?"Done":locked?"Locked":"Tap"}</span>
  </div>`;
}

async function showIndustryPicker() {
  const s = document.getElementById("s-onboarding");
  const picker = mk("div","screen"); picker.id = "s-ind-picker";
  picker.innerHTML = `
    <div class="hdr"><button class="hdr-back" onclick="this.closest('#s-ind-picker').remove();renderOnboarding()">←</button><div class="hdr-title">Choose Industry</div></div>
    <div class="scroll pad">
      <div class="ind-grid" id="ind-grid"></div>
      <button class="btn btn-gold mt8" id="ind-save-btn" disabled onclick="saveIndustry()">Save Industry →</button>
    </div>`;
  s.parentElement.appendChild(picker);
  SCREENS["ind-picker"] = picker;
  let selectedInd = kycData.industry || "";
  const grid = picker.querySelector("#ind-grid");
  grid.innerHTML = IND.map(i =>
    `<div class="ind-chip${selectedInd===i.n?" on":""}" onclick="selectInd('${i.n}',this)"><div class="ind-chip-em">${i.e}</div><div class="ind-chip-name">${i.n}</div></div>`
  ).join("");
  window.selectInd = (name, el) => {
    selectedInd = name; kycData.industry = name;
    grid.querySelectorAll(".ind-chip").forEach(c => c.classList.remove("on"));
    el.classList.add("on");
    picker.querySelector("#ind-save-btn").disabled = false;
  };
  window.saveIndustry = async () => {
    try {
      await api("/ask",{method:"POST",body:JSON.stringify({question:`Set my industry to ${kycData.industry}`})}).catch(()=>{});
      // Use the settings endpoint via the bot command — here we just store in api
      toast("✅ Industry set to " + kycData.industry);
      picker.remove();
      await renderOnboarding();
    } catch(e) { toast(e.message,"err"); }
  };
}

async function showAddProductFlow() {
  toast("Use the Stock tab to add your first product →");
  setTimeout(() => { enterApp(); switchTab("inv"); S.invView="add"; renderInv(); }, 800);
}

async function showProfileFlow(vendor, profile) {
  toast("Use /setphone and /setlocation in the Telegram bot");
}

/* ── KYC FLOW LOGIC ──────────────────────────────────────── */
function goKYC(id, push=true) {
  if (push) historyStack.push(currentScreen);
  const prev = SCREENS[currentScreen];
  if (prev) prev.classList.add("hidden");
  currentScreen = id;
  const el = SCREENS[id];
  if (el) el.classList.remove("hidden");
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.style.display = "block"; }
}
function clearErr(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}

function kycNext1() {
  const name  = document.getElementById("kyc-name")?.value?.trim();
  const bname = document.getElementById("kyc-bname")?.value?.trim();
  clearErr("kyc-name-err"); clearErr("kyc-bname-err");
  if (!name || name.length < 2) return showErr("kyc-name-err","Enter your full name");
  if (!bname || bname.length < 2) return showErr("kyc-bname-err","Enter your business name");
  kycData.name = name; kycData.business_name = bname;
  goKYC("kyc-step2");
}

function kycNext2() {
  const email = document.getElementById("kyc-email")?.value?.trim();
  clearErr("kyc-email-err");
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr("kyc-email-err","Enter a valid email address");
  kycData.email = email;
  goKYC("kyc-step3");
}

async function kycNext3() {
  const phone   = document.getElementById("kyc-phone")?.value?.trim();
  const address = document.getElementById("kyc-address")?.value?.trim();
  const city    = document.getElementById("kyc-city")?.value?.trim();
  const state   = document.getElementById("kyc-state")?.value?.trim();
  const industry= document.getElementById("kyc-industry")?.value;
  clearErr("kyc-phone-err");
  if (!phone || phone.replace(/\D/g,"").length < 10) return showErr("kyc-phone-err","Enter a valid phone number");
  if (!address) return toast("Enter your address","err");
  if (!city) return toast("Enter your city","err");
  if (!state) return toast("Enter your state","err");
  kycData.phone = phone; kycData.address = address; kycData.city = city;
  kycData.state = state; kycData.industry = industry || "Retail";

  // Submit KYC and send OTP
  const btn = document.querySelector("#s-kyc-step3 .btn-gold");
  if (btn) { btn.disabled = true; btn.textContent = "Sending OTP…"; }
  try {
    await apiPublic("/kyc/start",{method:"POST",body:JSON.stringify(kycData)});
    const desc = document.getElementById("otp-desc");
    if (desc) desc.textContent = `Enter the 6-digit code sent to ${kycData.email}`;
    goKYC("kyc-otp");
    setTimeout(() => document.getElementById("od0")?.focus(), 400);
  } catch(e) {
    toast(e.message,"err");
  }
  if (btn) { btn.disabled = false; btn.textContent = "Continue →"; }
}

// OTP digit input handlers
function otpInput(i) {
  const el = document.getElementById(`od${i}`);
  if (!el) return;
  el.value = el.value.replace(/\D/g,"");
  if (el.value) {
    el.classList.add("filled");
    if (i < 5) document.getElementById(`od${i+1}`)?.focus();
    else kycVerifyOTP(); // auto-submit when last digit entered
  }
}
function otpKey(i, e) {
  if (e.key === "Backspace" && !document.getElementById(`od${i}`)?.value && i > 0) {
    document.getElementById(`od${i-1}`)?.focus();
  }
}

async function kycVerifyOTP() {
  const code = [0,1,2,3,4,5].map(i => document.getElementById(`od${i}`)?.value||"").join("");
  const btn  = document.getElementById("otp-btn");
  const err  = document.getElementById("otp-err");
  if (code.length < 6) return toast("Enter all 6 digits","err");
  if (err) err.style.display = "none";
  if (btn) { btn.disabled = true; btn.textContent = "Verifying…"; }
  try {
    await apiPublic("/kyc/verify-email",{method:"POST",body:JSON.stringify({email:kycData.email, code})});
    goKYC("kyc-done");
    tg?.HapticFeedback?.notificationOccurred("success");
  } catch(e) {
    if (err) { err.textContent = e.message; err.style.display = "block"; }
    [0,1,2,3,4,5].forEach(i => { const el=document.getElementById(`od${i}`); if(el){el.value="";el.classList.remove("filled");} });
    document.getElementById("od0")?.focus();
  }
  if (btn) { btn.disabled = false; btn.textContent = "Verify Code →"; }
}

async function kycResendOTP() {
  try {
    await apiPublic("/kyc/resend-otp",{method:"POST",body:JSON.stringify({email:kycData.email})});
    toast("✅ New code sent to "+kycData.email);
  } catch(e) { toast(e.message,"err"); }
}

async function kycComplete() {
  if (!TG_ID) { toast("Open inside Telegram to link your account","err"); return; }
  try {
    await api("/kyc/complete",{method:"POST",body:JSON.stringify({email:kycData.email})});
    toast("✅ Account linked! Setting up your dashboard…");
    goKYC("onboarding");
    await renderOnboarding();
  } catch(e) {
    // If not verified yet, just go to onboarding anyway
    goKYC("onboarding");
    await renderOnboarding();
  }
}

function enterApp() {
  buildApp();
}

/* ── EMAIL CHECK (returning users) ──────────────────────────*/
// If TG user already has a linked profile, skip KYC entirely
async function checkExistingUser() {
  if (!TG_ID) {
    buildKYCFlow(); return;
  }
  try {
    const ob = await api("/onboarding");
    if (ob.steps?.kyc_complete) {
      // Fully set up — go straight to app
      buildApp();
    } else {
      // Has account but not finished onboarding
      goKYC("onboarding");
      buildKYCFlow();
      goKYC("onboarding", false);
      await renderOnboarding();
    }
  } catch(e) {
    // New user — show KYC flow
    buildKYCFlow();
  }
}

/* ── BOOT ────────────────────────────────────────────────── */
(async function boot() {
  const root = document.getElementById("root");
  if (!TG_ID) {
    // Not in Telegram — show web welcome with option to sign up
    root.innerHTML = `
      <div class="no-tg">
        <div class="no-tg-ico">📱</div>
        <h2>ShopBoss</h2>
        <p>Open inside Telegram for the full app experience, or sign up here to create your account first.</p>
        <button onclick="buildKYCFlow()" style="display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:#0A0800;font-family:var(--disp);font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none;border:none;cursor:pointer;margin-bottom:10px">🚀 Create Account</button>
        <a href="https://t.me/AiBizRepoBot" style="display:inline-flex;align-items:center;gap:7px;background:var(--c30);color:var(--text);font-family:var(--disp);font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none;border:1px solid var(--rim)">💬 Open in Telegram</a>
      </div>`;
    return;
  }
  // In Telegram — check if KYC is done
  await checkExistingUser();
})();
</script>
